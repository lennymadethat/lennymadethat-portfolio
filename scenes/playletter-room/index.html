<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayLetter Room</title>
<meta name="description" content="An ambient PlayLetter room: a day passes while he listens.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&family=Jost:wght@400&display=swap">
<style>
  :root {
    --paper: #F7F4EE;
    --ink: #1A1A18;
    --mint: #5FB089;
    --mint-deep: #2F7A57;
    --glass: rgba(255, 255, 255, 0.62);
    --glass-line: rgba(26, 26, 24, 0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E9E4DC; color: var(--ink); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* The room is authored at 2000 x 1116; JS scales and pans it to fit. */
  #view { position: fixed; inset: 0; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #stage > * { position: absolute; }
  .plate { left: 0; top: 0; width: 100%; height: 100%; transition: opacity 1.2s ease; }
  /* the painted mark on the wall, with a live wordmark */
  #brand { left: 834px; top: 368px; width: 332px; text-align: center; }
  #brand img { width: 332px; display: block; }
  #brand span { display: block; margin-top: 26px; font: 400 40px/1 Jost, sans-serif; letter-spacing: .32em; padding-left: .32em; color: #4A4A45; }

  #wave { left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #view { background: #E9E4DC; }

  /* app screens on the glass panels (mapped with matrix3d) */
  /* floating phones: a dark bezel around the real app screen, hovering over the floor */
  .fphone { width: 208px; height: 450px; padding: 9px; border-radius: 38px; background: linear-gradient(145deg, #2a2d33, #0e1014 55%, #23262b);
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.18) inset, 0 30px 60px -20px rgba(30,24,18,.45); will-change: transform; transform-origin: 50% 50%; }
  .fphone .screen { position: relative; width: 190px; height: 432px; border-radius: 30px; }
  /* PlayLetter screens, set in the paper look (a night version swaps in after dark) */
  .ps { --bg: #F7F4EE; --fg: #1A1A18; --mute: #8C877D; --line: rgba(26,26,24,.08); --card: #FFFFFF;
    background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; transition: background 2s ease, color 2s ease; }
  .night .ps { --bg: #16191C; --fg: #ECE8E0; --mute: #7E8287; --line: rgba(255,255,255,.08); --card: #1F2327; }
  .fphone .screen.ps { display: flex; flex-direction: column; padding: 8px 12px 10px; }
  .ps-status { display: flex; justify-content: space-between; font: 600 8px/1 Inter; color: var(--fg); padding: 4px 4px 10px; }
  .ps-sig { width: 22px; height: 7px; border-radius: 2px; background: linear-gradient(90deg, var(--fg) 60%, transparent 60%); opacity: .7; }
  .ps-h { font: italic 400 22px/1 Fraunces, serif; margin: 2px 2px 10px; }
  .ps-chips { display: flex; gap: 5px; margin: 0 2px 10px; }
  .ps-chips span { font: 600 8px/1 Inter; padding: 5px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); }
  .ps-chips span.on { background: var(--mint); border-color: var(--mint); color: #fff; }
  .ps-listwrap { flex: 1; overflow: hidden; position: relative; }
  .ps-list { position: absolute; left: 0; right: 0; will-change: transform; }
  .ps-item { display: flex; gap: 9px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  .ps-item img { width: 40px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; }
  .ps-item b { display: block; font: 600 10px/1.2 Inter; }
  .ps-item small { display: block; font: 500 8px/1.4 Inter; color: var(--mute); margin-top: 2px; }
  .ps-item .pl { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; background: var(--mint); flex: none; position: relative; }
  .ps-item .pl::after { content: ""; position: absolute; left: 8px; top: 6px; border-left: 6px solid #fff; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
  .ps-nav { display: flex; justify-content: space-around; padding-top: 8px; border-top: 1px solid var(--line); }
  .ps-nav span { width: 14px; height: 14px; border-radius: 4px; background: var(--line); }
  .ps-nav span.on { background: var(--mint); }
  .ps-top { display: flex; align-items: center; gap: 6px; margin: 0 2px 12px; }
  .ps-top img { width: 22px; }
  .ps-top span { font: 400 11px/1 Jost, sans-serif; letter-spacing: .18em; }
  .ps-top b { font-weight: 400; color: var(--mint); }
  .ps-pub { font: 600 8px/1 Inter; letter-spacing: .08em; text-transform: uppercase; color: var(--mint); margin: 0 2px 4px; }
  .ps-title { font: italic 400 19px/1.1 Fraunces, serif; margin: 0 2px 10px; }
  .ps-kwrap { flex: 1; overflow: hidden; position: relative; -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 78%, transparent); mask-image: linear-gradient(transparent, #000 18%, #000 78%, transparent); }
  .ps-karaoke { position: absolute; left: 2px; right: 2px; font: normal 400 15px/1.5 Fraunces, serif; color: var(--mute); transition: transform .6s cubic-bezier(.3,.7,.2,1); will-change: transform; }
  .ps-karaoke span { transition: color .25s ease, background .25s ease; border-radius: 4px; padding: 0 1px; }
  .ps-karaoke span.done { color: var(--fg); }
  .ps-karaoke span.now { color: #fff; background: var(--mint); }
  .ps-bar { height: 3px; border-radius: 2px; background: var(--line); margin: 10px 2px 8px; overflow: hidden; }
  .ps-bar i { display: block; height: 100%; width: 0; background: var(--mint); }
  .ps-ctrl { display: flex; align-items: center; justify-content: center; gap: 22px; }
  .ps-play { width: 38px; height: 38px; border-radius: 50%; background: var(--mint); display: flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 6px 16px -6px rgba(95,176,137,.8); }
  .ps-play i { width: 3.5px; height: 12px; border-radius: 1px; background: #fff; }
  .ps-skip { width: 0; height: 0; border-right: 8px solid var(--fg); border-top: 6px solid transparent; border-bottom: 6px solid transparent; opacity: .6; }
  .ps-skip.r { border-right: 0; border-left: 8px solid var(--fg); }
  .ps-voice { text-align: center; font: 500 8px/1 Inter; color: var(--mute); margin-top: 9px; }
  .ps-voice b { color: var(--fg); font-weight: 600; }
  .ps-hero { position: relative; height: 150px; margin: 4px 2px 10px; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 18px -10px rgba(0,0,0,.4); }
  .ps-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 1.2s ease; }
  .ps-ititle { font: italic 400 18px/1.15 Fraunces, serif; margin: 0 2px 4px; }
  .ps-imeta { font: 500 8px/1 Inter; color: var(--mute); margin: 0 2px 10px; }
  .ps-lines { flex: 1; padding: 0 2px; }
  .ps-lines i { display: block; height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 7px; }
  .ps-lines i:nth-child(2n) { width: 86%; } .ps-lines i:last-child { width: 58%; }
  .ps-listen { display: flex; align-items: center; justify-content: center; gap: 7px; height: 32px; border-radius: 99px; background: var(--mint); color: #fff; font: 600 10px/1 Inter; }
  .ps-listen span { border-left: 7px solid #fff; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
  .ps-ring { width: 108px; height: 108px; margin: 6px auto 10px; border-radius: 50%; border: 3px solid var(--mint); display: grid; place-items: center;
    box-shadow: 0 0 0 7px rgba(95,176,137,.14); background: var(--card); }
  .ps-ring span { font: italic 400 44px/1 Fraunces, serif; color: var(--mint); }
  .ps-vname { text-align: center; font: 600 13px/1 Inter; margin-bottom: 8px; }
  .ps-vwave { display: flex; gap: 2px; justify-content: center; align-items: center; height: 20px; margin-bottom: 10px; }
  .ps-vwave i { width: 3px; border-radius: 2px; background: var(--mint); }
  .ps-vlist { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .ps-vlist span { font: 600 9px/1 Inter; padding: 8px 0; text-align: center; border-radius: 8px; border: 1px solid var(--line); color: var(--mute); transition: all .4s ease; }
  .ps-vlist span.on { background: var(--mint); border-color: var(--mint); color: #fff; }
  /* the phone in his hand: a small twin of the floating screen he is on */
  .hs-view { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease; }
  .hs-view.on { opacity: 1; }
  .hs-h { height: 14px; width: 60%; margin: 22px 14px 14px; border-radius: 4px; background: var(--fg); opacity: .8; }
  .hs-libwrap { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .hs-lib { position: absolute; left: 0; right: 0; transition: transform .5s cubic-bezier(.3,.7,.2,1); }
  .hs-row { display: flex; gap: 8px; align-items: center; padding: 6px 12px; }
  .hs-row img { width: 30px; height: 34px; border-radius: 4px; object-fit: cover; }
  .hs-row span { flex: 1; height: 8px; border-radius: 4px; background: rgba(26,26,24,.18); }
  .hs-row b { width: 14px; height: 14px; border-radius: 50%; background: var(--mint); }
  .night .hs-row span { background: rgba(255,255,255,.2); }
  .hs-hero { display: block; width: 92px; height: 100px; margin: 26px auto 16px; border-radius: 8px; object-fit: cover; }
  .hs-ilines i { height: 8px; margin-bottom: 9px; }
  .hs-listen { height: 22px; margin: 10px 18px 0; border-radius: 11px; background: var(--mint); }
  .hs-ring { width: 72px; height: 72px; margin: 40px auto 20px; border-radius: 50%; border: 4px solid var(--mint); display: grid; place-items: center; }
  .hs-ring span { font: italic 400 36px/1 Fraunces, serif; color: var(--mint); }
  .hs-pills { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 14px; }
  .hs-pills i { height: 16px; border-radius: 5px; background: rgba(26,26,24,.12); transition: background .4s ease; }
  .hs-pills i.on { background: var(--mint); }
  .night .hs-pills i { background: rgba(255,255,255,.14); }
  .night .hs-pills i.on { background: var(--mint); }
  .hs-mark { display: block; width: 46px; margin: 34px auto 26px; }
  .hs-lines { padding: 0 16px; }
  .hs-lines i { display: block; height: 9px; border-radius: 5px; background: rgba(26,26,24,.14); margin-bottom: 11px; transition: background .4s ease; }
  .hs-lines i:nth-child(3n) { width: 70%; }
  .hs-lines i.now { background: var(--mint); }
  .night .hs-lines i { background: rgba(255,255,255,.16); }
  .night .hs-lines i.now { background: var(--mint); }
  .hs-bar { margin: 26px 16px 0; height: 6px; border-radius: 3px; background: rgba(26,26,24,.1); overflow: hidden; }
  .hs-bar i { display: block; height: 100%; width: 40%; background: var(--mint); }
  .fshadow { width: 200px; height: 34px; border-radius: 50%; background: radial-gradient(closest-side, rgba(60,44,30,.42), rgba(60,44,30,0)); will-change: transform, opacity; }
  .screen { overflow: hidden; }
  .screen.ps { background: var(--bg); }
  .screen img { display: block; }
  .screen::after { content: ""; position: absolute; inset: 0; z-index: 3; border-radius: inherit;
    background: linear-gradient(115deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,.08) 100%); }
  .progress { position: absolute; left: 21px; top: 214px; height: 3px; width: 0; background: var(--mint); border-radius: 2px; z-index: 2; }

  /* the man: the body and three cut pieces that move */
  .piece { will-change: transform; }
  .piece > img { position: absolute; left: 0; top: 0; }
  #handScreen { left: 0; top: 0; width: 120px; height: 280px; overflow: hidden; border-radius: 12px; transform-origin: 0 0; }

  #shade { left: 0; top: 0; width: 100%; height: 100%; mix-blend-mode: multiply; pointer-events: none; }
  #glow  { left: 0; top: 0; width: 2000px; height: 1116px; mix-blend-mode: screen; pointer-events: none; }

  /* ---- overlay UI ---- */
  .ui { position: fixed; z-index: 10; }
  #copy { left: clamp(16px, 4vw, 56px); top: 34vh; max-width: 380px; }
  #copy h1 { margin: 0 0 6px; font: italic 400 clamp(34px, 4.2vw, 56px)/1.02 Fraunces, Georgia, serif; letter-spacing: -.01em; color: var(--ink); }
  #copy h1 em { font-style: italic; color: var(--mint-deep); }
  #copy p { margin: 0 0 18px; font-size: clamp(15px, 1.2vw, 17px); color: #3A3A36; }
  .ctas { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; font: 600 15px/1 Inter, sans-serif; text-decoration: none; transition: transform .2s ease, background .2s ease; }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--mint-deep); outline-offset: 3px; }
  .btn--primary { background: var(--ink); color: var(--paper); }
  .btn--ghost { background: var(--glass); color: var(--ink); border: 1px solid var(--glass-line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  #controls { top: clamp(12px, 3vh, 28px); right: clamp(12px, 3vw, 28px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .pill { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .pill button { min-width: 36px; height: 30px; padding: 0 10px; border: 0; border-radius: 999px; background: transparent; color: #3A3A36; font: 500 13px/1 Inter, sans-serif; cursor: pointer; }
  .pill button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .pill button:focus-visible { outline: 2px solid var(--mint-deep); outline-offset: 1px; }
  #clock { padding: 0 12px; height: 38px; display: flex; align-items: center; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); font: 500 13px/1 Inter, sans-serif; font-variant-numeric: tabular-nums; color: #3A3A36; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* inside the portfolio swipe the site header sits over the top 76px */
  .embed #view { top: 68px; }
  .embed #controls { top: 84px; }
  .tall #brand, .tall .fshadow { display: none; }
  html.tall #copy { left: 0; right: 0; max-width: none; padding: 0 16px; background: none; text-align: center; }
  html.tall .ctas { justify-content: center; }
  .embed #copy { left: clamp(16px, 7vw, 104px); }
  @media (max-width: 640px) {
    .embed #copy { left: 0; padding-top: 128px; }
    #copy { right: 0; left: 0; top: 0; bottom: auto; max-width: none; padding: 78px 16px 40px;
      background: linear-gradient(to bottom, rgba(247,244,238,.92) 60%, rgba(247,244,238,0)); }
    #controls { left: 16px; right: 16px; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div id="view" aria-hidden="true">
  <div id="stage">
    <img class="plate" id="plate" alt="">

    <div id="brand"><img src="img/mark.webp" alt=""><span>PLAYLETTER</span></div>

    <div class="fshadow" data-i="0"></div><div class="fshadow" data-i="1"></div><div class="fshadow" data-i="2"></div>

    <img id="body" class="piece" data-src="man-body.webp" alt="">
    <div id="head" class="piece"><img data-src="man-head.webp" alt=""></div>
    <div id="hand" class="piece">
      <img data-src="man-hand.webp" alt="">
      <div id="handScreen" class="ps" style="position:absolute">
        <div class="hs-view" data-v="0"><div class="hs-h"></div><div class="hs-libwrap"><div class="hs-lib" id="hsLib"></div></div></div>
        <div class="hs-view" data-v="1"><img class="hs-mark" src="img/mark.webp" alt="">
          <div class="hs-lines"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="hs-bar"><i></i></div></div>
        <div class="hs-view" data-v="2"><img class="hs-hero" id="hsHero" alt="">
          <div class="hs-lines hs-ilines"><i></i><i></i><i></i></div><div class="hs-listen"></div></div>
      </div>
      <img id="fingers" data-src="man-fingers.webp" alt="">
    </div>
    <div id="foot" class="piece"><img data-src="man-foot.webp" alt=""></div>
    <img id="arm" alt="">

    <canvas id="shade"></canvas>
    <div class="fphone" data-i="0"><div class="screen ps" id="scrLib">
      <div class="ps-status"><span>9:41</span><span class="ps-sig"></span></div>
      <div class="ps-h">Library</div>
      <div class="ps-chips"><span class="on">All</span><span>Unplayed</span><span>Mornings</span></div>
      <div class="ps-listwrap"><div class="ps-list" id="libList"></div></div>
      <div class="ps-nav"><span class="on"></span><span></span><span></span><span></span></div>
    </div></div>
    <div class="fphone" data-i="1"><div class="screen ps" id="scrPlayer">
      <div class="ps-status"><span>9:41</span><span class="ps-sig"></span></div>
      <div class="ps-top"><img src="img/mark.webp" alt=""><span>PLAY<b>LETTER</b></span></div>
      <div class="ps-pub">The Second Inbox</div>
      <div class="ps-title">Just listen</div>
      <div class="ps-kwrap"><div class="ps-karaoke" id="karaoke"></div></div>
      <div class="ps-bar"><i id="kProg"></i></div>
      <div class="ps-ctrl"><span class="ps-skip"></span><span class="ps-play"><i></i><i></i></span><span class="ps-skip r"></span></div>
      <div class="ps-voice">Read by <b id="kVoice">Lily</b></div>
    </div></div>
    <div class="fphone" data-i="2"><div class="screen ps" id="scrIssue">
      <div class="ps-status"><span>9:41</span><span class="ps-sig"></span></div>
      <div class="ps-pub" id="iPub">Slow Mornings</div>
      <div class="ps-hero"><img id="iHeroA" alt=""><img id="iHeroB" alt=""></div>
      <div class="ps-ititle" id="iTitle">The coffee hour</div>
      <div class="ps-imeta" id="iMeta">Issue 14 · 6 min</div>
      <div class="ps-lines"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="ps-listen"><span></span>Listen</div>
    </div></div>
    <canvas id="wave"></canvas>
    <canvas id="glow"></canvas>
  </div>
</div>

<section id="copy" class="ui" aria-label="PlayLetter">
  <h1>Just <em>listen.</em></h1>
  <p>Your newsletters, out loud.</p>
  <div class="ctas">
    <a class="btn btn--primary" href="https://playletter.com" target="_top">Open PlayLetter</a>
    <a class="btn btn--ghost" href="/products/playletter" target="_top">How it works</a>
  </div>
</section>

<div id="controls" class="ui">
  <div id="clock" aria-live="off">—</div>
</div>

<script type="module">

const TALL = innerWidth / innerHeight < 0.8;
const L = TALL ? {

  piv: { foot: [776, 2468], head: [230, 2240], hand: [630, 2512], body: [330, 2620] },

  shadows: false,
  floorY: 1870, floorK: 0.4,
  sun: [

    [9.2, 1210, 2380, 16, -6, 1.25, 1.4, 0.85, 0.1],
    [10.8, 1060, 2200, 8, -6, 1.25, 1.3, 0.9, 0],
    [12.2, 960, 1800, 0, -8, 1.3, 1.15, 0.9, 0],
    [13.8, 860, 1350, 0, -10, 1.3, 1.1, 0.9, 0.05],
    [15.3, 760, 950, 0, -12, 1.3, 1.05, 0.88, 0.25],
    [16.7, 560, 600, 0, -14, 1.3, 1.0, 0.82, 0.6],
    [17.9, 360, 330, 0, -16, 1.3, 1.0, 0.7, 0.9],
    [18.8, 200, 150, 0, -18, 1.3, 1.0, 0.45, 1],
    [19.2, 150, 100, 0, -18, 1.3, 1.0, 0, 1],

    [8.6, 1150, 2290, 10, -6, 1.1, 1.25, 0],
  ],
  shaft: { from: [1560, 860], to: [1560, 1760], aim: [1560, 1300] },
  glows: { mark: [768, 820, 420], window: null },
  laptopQuad: [[864, 1998], [1112, 2006], [1096, 2180], [838, 2174]],
  brand: null,
  wave: [[440, 1096, 1010, 12, 7, 90]],
} : {

libList.innerHTML = LIB.map(libRow).join("") + LIB.map(libRow).join("");
let libH = 0, libY = 0, libTarget = 0, libNext = 0;
// the right-hand phone: an issue of a newsletter, its cover one of the paintings on the wall
const ISSUES = [["Slow Mornings", "The coffee hour", 3, 14, 6], ["Paper Boats", "Small things, sent far", 5, 9, 4],
  ["Window Seat", "Notes from the city", 2, 22, 8], ["Night Letters", "After the lights go down", 1, 31, 7], ["Faces", "A face in the crowd", 4, 6, 11]];
const iHeroA = $("#iHeroA"), iHeroB = $("#iHeroB");
let iIdx = -1, iNext = 0, iFront = iHeroB;
function nextIssue(t) {
  iIdx = (iIdx + 1) % ISSUES.length; iNext = t + 7000;
  const [pub, title, art, no, min] = ISSUES[iIdx];
  const back = iFront === iHeroA ? iHeroB : iHeroA;
  back.src = `img/issue-${art}.webp`; back.style.opacity = 1; iFront.style.opacity = 0; iFront = back;
  $("#iPub").textContent = pub; $("#iTitle").textContent = title; $("#iMeta").textContent = `Issue ${no} · ${min} min`;
  $("#hsHero").src = `img/issue-${art}.webp`;
}
iHeroA.style.opacity = 0; iHeroB.style.opacity = 0;

// his phone mirrors one floating screen at a time; a tap moves both
const hsViews = [...document.querySelectorAll(".hs-view")];
const hsLib = $("#hsLib");
hsLib.innerHTML = [...LIB, ...LIB].map(([, , c]) => `<div class="hs-row"><img src="img/cover-${c}.webp" alt=""><span></span><b></b></div>`).join("");
let hsCur = 1, hsLibStep = 0;
hsViews.forEach((v, i) => v.classList.toggle("on", i === hsCur));
function touchScreen(t) {
  hsCur = (hsCur + 1) % 3;
  hsViews.forEach((v, i) => v.classList.toggle("on", i === hsCur));
  touchedAt[hsCur] = t;
  if (hsCur === 0) { libTarget += 59; libNext = t + 2400; hsLibStep = (hsLibStep + 1) % LIB.length; hsLib.style.transform = `translateY(${-46 * hsLibStep}px)`; }
  if (hsCur === 2) iNext = 0;                                     // he opens the next issue
}

// karaoke: words light up one at a time, in step with the waveform on the wall
const PASSAGE = ("Pour the coffee. Leave the inbox where it is. The letters you meant to read are already playing, " +
  "in a voice you picked, at the pace you like. Somewhere between one paragraph and the next, the light moves " +
  "across the floor. Nothing to scroll. Nothing to skim. Just listen.").split(" ");
const kEl = $("#karaoke");
kEl.innerHTML = PASSAGE.map((w) => `<span>${w}</span>`).join(" ");
const kWords = [...kEl.children], kProg = $("#kProg");
const handLines = [...document.querySelectorAll(".hs-lines i")], handBar = $(".hs-bar i");
let kIdx = -1, kNextAt = 0, wordPulse = 0, kLineTop = -1;
function wordLength(w) { return 230 + w.length * 34 + (/[.,]$/.test(w) ? 380 : 0); }

function screens(t, dt) {
  // library: a gentle scroll every few seconds, looping
  if (!libH) libH = libList.scrollHeight / 2;
  if (t > libNext) { libTarget += 59; libNext = t + 2800 + Math.random() * 2600; }
  libY += (libTarget - libY) * Math.min(1, dt / 380);
  libList.style.transform = `translateY(${-(libY % libH)}px)`;
  // karaoke
  if (t >= kNextAt) {
    kIdx = (kIdx + 1) % (PASSAGE.length + 3);                    // a short breath at the end of the passage
    if (kIdx === 0) kWords.forEach((w) => (w.className = ""));
    if (kIdx < PASSAGE.length) {
      if (kIdx > 0) kWords[kIdx - 1].className = "done";
      kWords[kIdx].className = "now";
      wordPulse = 1;
      const top = kWords[kIdx].offsetTop;
      if (top !== kLineTop) { kLineTop = top; kEl.style.transform = `translateY(${-Math.max(0, top - 54)}px)`; }
      kNextAt = t + wordLength(PASSAGE[kIdx]);
      handLines.forEach((l, i) => l.classList.toggle("now", i === Math.floor(kIdx / 8) % handLines.length));
    } else {
      if (kIdx === PASSAGE.length) kWords[PASSAGE.length - 1].className = "done";
      kNextAt = t + 900;
      if (kIdx === PASSAGE.length + 2) { kLineTop = -1; kEl.style.transform = "translateY(0)"; }
    }
    const f = Math.min(1, (kIdx + 1) / PASSAGE.length);
    kProg.style.width = `${f * 100}%`; handBar.style.width = `${f * 100}%`;
  }
  wordPulse *= Math.pow(0.004, dt / 1000);
  if (t > iNext) nextIssue(t);
  floatPhones(t);
}

// ---------- clock ----------
const clock = $("#clock");
const fmt = (h) => { const hh = Math.floor(h) % 24, mm = Math.floor((h % 1) * 60); return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, "0")} ${hh < 12 ? "am" : "pm"}`; };

// ---------- loop ----------
let last = performance.now(), running = true, lastLight = -1;
function frame(now) {
  if (!running) return;
  const dt = Math.min(100, now - last); last = now;
  if (!reduced) hour = (hour + (dt * 24) / DAY_MS) % 24;
  applyCamera(now);
  const tap = reduced ? 0 : man(now);
  if (!reduced) screens(now, dt);
  drawWave(reduced ? 3000 : now, Math.max(tap * 0.6, reduced ? 0 : wordPulse));
  if (Math.abs(hour - lastLight) > 0.0015 || lastLight < 0) { drawLight(hour); lastLight = hour; }
  clock.textContent = fmt(hour);
  if (!reduced) requestAnimationFrame(frame);
}
function start() { if (running && !reduced) return; running = true; last = performance.now(); requestAnimationFrame(frame); }
function stop() { running = false; }
document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
// the portfolio carousel tells the scene when it is on screen
addEventListener("message", (e) => {
  if (e.origin !== location.origin) return;
  if (e.data === "scene:pause") stop();
  if (e.data === "scene:play") start();
});
running = false; start();
if (reduced) { running = true; frame(performance.now()); }
</script>
</body>
</html>
