<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIR Desk</title>
<meta name="description" content="An ambient Retail Investor Report desk: Carl rises out of the centre screen and strikes the real product onto the glass.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    --blue: #8AC7DE;        /* RIR light blue */
    --deep: #1E293B;        /* RIR darkest blue */
    --night: #070B12;
    --ink: #E8EEF4;
    --mute: #9AA8B8;
    --green: #5fe0a0;
    --glass: rgba(18, 27, 42, 0.62);
    --glass-line: rgba(138, 199, 222, 0.24);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--ink); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* The desk is authored in the plate's own pixels; JS scales and frames it. */
  #view { position: fixed; inset: 30px 0 0 0; overflow: hidden; background: var(--night); opacity: 0; transition: opacity .5s ease; }
  .ready #view { opacity: 1; }
  #stage { visibility: hidden; }
  .wide #stage { visibility: visible; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #stage > *, .scr, .bolt, .impact, .spill { position: absolute; }
  .plate, #screens, #fx { left: 0; top: 0; }

  /* the real product on the glass, mapped with matrix3d onto each monitor */
  .scr { left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #0b1220; }
  .scr-in { position: absolute; top: 0; }
  .scr-in img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: left top;
    opacity: 0; transition: opacity .45s ease; filter: brightness(.9) saturate(.95) contrast(1.04); }
  .scr-in img.on { opacity: 1; }
  .scr-in::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(130% 130% at 50% 40%, rgba(0,0,0,0) 60%, rgba(4,8,16,.5) 100%); }
  .scr-in::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: linear-gradient(118deg, rgba(170,220,240,.10) 0%, rgba(170,220,240,0) 34%, rgba(170,220,240,0) 72%, rgba(170,220,240,.05) 100%); }
  .scr-in .flash { position: absolute; inset: 0; z-index: 4; opacity: 0; pointer-events: none;
    background: radial-gradient(70% 90% at var(--fx, 50%) var(--fy, 50%), rgba(200,236,250,.9), rgba(138,199,222,.35) 45%, rgba(138,199,222,0) 80%); mix-blend-mode: screen; }

  /* the phone on the desk: someone asking Carl */
  #phone { left: 0; top: 0; width: 120px; height: 246px; transform-origin: 0 0; overflow: hidden; border-radius: 14px;
    background: linear-gradient(180deg, #101a2a, #0a111c); color: var(--ink); font-family: Inter, sans-serif; padding: 26px 12px 10px; }
  #phone .lbl { font: 600 9px/1 Inter; letter-spacing: .14em; color: var(--blue); }
  #phone .dot { width: 54px; height: 54px; margin: 22px auto 18px; border-radius: 50%;
    background: radial-gradient(circle at 45% 40%, #EAF8FF, #8AC7DE 30%, #24506a 70%, #0b1220); box-shadow: 0 0 18px rgba(138,199,222,.6); }
  #phone .q { font: 500 13px/1.35 Inter, sans-serif; color: #fff; background: rgba(138,199,222,.14); border: 1px solid rgba(138,199,222,.25);
    border-radius: 12px 12px 12px 4px; padding: 9px 10px; min-height: 64px; }
  #phone::after { content: ""; position: absolute; inset: 0; background: linear-gradient(125deg, rgba(255,255,255,.10), rgba(255,255,255,0) 40%); }

  .light { mix-blend-mode: screen; pointer-events: none; }
  #halo { width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,210,235,.42), rgba(110,180,214,.16) 45%, rgba(110,180,214,0)); will-change: opacity, transform; }
  #orb { will-change: transform, filter; transform-origin: 50% 50%; }
  .carlvid { opacity: 0; transition: opacity .6s ease; transform-origin: 50% 50%; pointer-events: none; object-fit: cover;
    -webkit-mask-image: radial-gradient(circle closest-side, #000 70%, transparent 100%); mask-image: radial-gradient(circle closest-side, #000 70%, transparent 100%); }
  #man { transform-origin: 50% 100%; will-change: transform; }
  .bolt { left: 0; top: 0; opacity: 0; will-change: opacity; transform-origin: 0 0; }
  .bolt img { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; filter: brightness(2.1) saturate(1.15); }
  .bolt img.glow { filter: brightness(2.6) blur(5px); opacity: .9; }
  .impact { width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, rgba(235,250,255,.95), rgba(138,199,222,.45) 35%, rgba(138,199,222,0)); }
  .spill { width: 700px; height: 520px; margin: -260px 0 0 -350px; border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, rgba(120,190,225,.30), rgba(120,190,225,0)); }
  #twinkle { left: 0; top: 0; }

  /* ---- overlay UI ---- */
  .ui { position: fixed; z-index: 10; }
  #scrim { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: linear-gradient(to top, rgba(7,11,18,.9) 0%, rgba(7,11,18,.55) 22%, rgba(7,11,18,0) 42%); }

  /* the tape: every income fund is somebody's paycheck */
  #tape { position: fixed; left: 0; right: 0; top: 0; height: 30px; z-index: 9; overflow: hidden; display: flex; align-items: center;
    background: rgba(7,11,18,.78); border-bottom: 1px solid rgba(138,199,222,.14);
  }
  #tape .runwrap { -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 4%, #000 95%, transparent); }
  #tape .run { display: flex; white-space: nowrap; animation: tape 34s linear infinite; will-change: transform; }
  #tape span { font: 500 11.5px/1 "DM Mono", monospace; color: #8592a3; padding: 0 14px; letter-spacing: .01em; border-right: 1px solid rgba(138,199,222,.12); }
  #tape span b { color: #fff; font-weight: 500; margin-right: 6px; }
  #tape span em { font-style: normal; color: #c9d4df; margin-right: 6px; }
  #tape span i { font-style: normal; color: var(--green); margin-right: 6px; }
  #tape span u { text-decoration: none; color: var(--blue); }
  #tape span.brag { color: var(--blue); letter-spacing: .14em; text-transform: uppercase; font-size: 10.5px; }
  #tape span.hot b, #tape span.hot i { animation: tick .9s ease; }
  @keyframes tick { 0% { color: #fff; text-shadow: 0 0 10px rgba(95,224,160,.9); } 100% { text-shadow: none; } }
  @keyframes tape { to { transform: translateX(-50%); } }

  #copy { left: clamp(16px, 4vw, 56px); bottom: clamp(20px, 5vh, 56px); max-width: 440px; }
  #copy .logo { display: block; width: min(330px, 70vw); height: auto; margin: 0 0 16px; filter: drop-shadow(0 2px 12px rgba(0,0,0,.6)); }
  #copy h1 { margin: 0 0 8px; font: 700 clamp(32px, min(4.4vw, 7.4vh), 60px)/1 Barlow, sans-serif; letter-spacing: -.01em; color: #fff; }
  #copy h1 em { font-style: italic; color: var(--blue); }
  #copy p { margin: 0 0 16px; font-size: clamp(15px, 1.2vw, 17px); color: #C9D4DF; }
  .ctas { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; font: 600 15px/1 Inter, sans-serif; text-decoration: none; transition: transform .2s ease, background .2s ease; }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .btn--primary { background: var(--blue); color: var(--deep); }
  .btn--ghost { background: var(--glass); color: var(--ink); border: 1px solid var(--glass-line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  /* on wide screens the wordmark rides at the head of the tape; on phones it tops the copy */
  #tape .tlogo { flex: none; height: 15px; width: auto; margin: 0 18px 0 22px; position: relative; z-index: 2; }
  #tape .runwrap { flex: 1; overflow: hidden; }
  .broad #copy .logo, .narrow #tape .tlogo { display: none; }

  /* the receipts: three numbers from the platform */
  #stats { right: clamp(12px, 3vw, 40px); bottom: clamp(20px, 5vh, 56px); display: flex; gap: 10px; }
  .stat { min-width: 128px; padding: 12px 14px 11px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .stat b { display: block; font: 700 28px/1 Barlow, sans-serif; color: #fff; font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 6px; font: 500 10.5px/1.25 "DM Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }

  /* Carl talks: a chat window in the upper corner of the screen he just struck (Lenny 10-08) */
  .callout { position: fixed; z-index: 8; width: 260px; padding: 9px 12px 10px; border-radius: 16px; pointer-events: none;
    background: rgba(9,16,28,.86); border: 1px solid rgba(138,199,222,.38);
    box-shadow: 0 10px 34px -10px rgba(0,0,0,.7), 0 0 22px -6px rgba(110,180,214,.45);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; transform: translateY(6px) scale(.94); transition: opacity .3s ease, transform .45s cubic-bezier(.2,.9,.25,1.15); }
  .callout.left { border-top-left-radius: 4px; transform-origin: 0 0; }
  .callout.right { border-top-right-radius: 4px; transform-origin: 100% 0; }
  .callout.on { opacity: 1; transform: none; }
  .callout .k { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font: 500 9.5px/1 "DM Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); white-space: nowrap; overflow: hidden; }
  .callout .av { width: 16px; height: 16px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 45% 40%, #EAF8FF, #8AC7DE 32%, #24506a 72%, #0b1220); box-shadow: 0 0 8px rgba(138,199,222,.7); }
  .callout .who { color: #fff; }
  .callout .tool { color: var(--blue); overflow: hidden; text-overflow: ellipsis; }
  .callout .t { font: 500 13px/1.36 Inter, sans-serif; color: #eaf1f7; min-height: 2.72em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .callout.typing .t { color: transparent; position: relative; }
  .callout.typing .t::after { content: "• • •"; position: absolute; left: 0; top: 0; color: var(--blue); letter-spacing: .1em; animation: typing 1s ease-in-out infinite; }
  @keyframes typing { 50% { opacity: .35; } }

  /* inside the portfolio swipe the site header sits over the top 68px */
  /* inside the swipe the scene runs to the very top: the band under the (late-arriving) site header is sky, not a gap */
  .embed #view { top: 0; }
  .embed #tape { top: 68px; }
  .embed #copy { left: clamp(16px, 7vw, 104px); }

  /* phones: copy on top over the sky, receipts in a row at the foot */
  .narrow #scrim { background: linear-gradient(to bottom, rgba(7,11,18,.92) 0%, rgba(7,11,18,.55) 30%, rgba(7,11,18,0) 46%),
                             linear-gradient(to top, rgba(7,11,18,.75) 0%, rgba(7,11,18,0) 20%); }
  .narrow #copy { left: 0; right: 0; top: 30px; bottom: auto; max-width: none; padding: 16px 16px 0; }
  .narrow.embed #copy { top: 98px; left: 0; }
  .narrow #copy .logo { width: min(250px, 66vw); margin-bottom: 12px; }
  .narrow #copy h1 { font-size: 40px; }
  .narrow #copy p { margin-bottom: 12px; font-size: 15px; }
  .narrow .btn { height: 40px; padding: 0 16px; font-size: 14px; }
  .narrow #stats { left: 16px; right: 16px; bottom: 24px; gap: 6px; }
  .narrow.embed #stats { bottom: 78px; }
  .narrow .stat { flex: 1; min-width: 0; padding: 9px 10px 8px; }
  .narrow .stat b { font-size: 21px; }
  .narrow .stat span { font-size: 9px; }
  @media (max-width: 900px) { #stats .stat:nth-child(3) { display: none; } }

  /* the tall desk: words centred in the sky above Carl, the way the PlayLetter room does it */
  .tall #scrim { background: linear-gradient(to bottom, rgba(7,11,18,.55) 0%, rgba(7,11,18,0) 26%); }
  .tall #copy { text-align: center; padding-top: 14px; }
  .tall #copy .logo { margin: 0 auto 10px; width: min(230px, 60vw); }
  .tall #copy h1 { font-size: clamp(34px, 9.5vw, 42px); margin-bottom: 4px; }
  .tall #copy p { margin-bottom: 12px; }
  .tall .ctas { justify-content: center; }
  .tall #stats { display: none; }
  .narrow #tape, .narrow .btn--ghost, .narrow .callout, .narrow .stat { backdrop-filter: none; -webkit-backdrop-filter: none; }
  .narrow .callout { width: 236px; background: rgba(9,16,28,.92); padding: 8px 11px 9px; }
  .narrow .callout .t { font-size: 12.5px; }
  .narrow .btn--ghost { background: rgba(18,27,42,.88); }
  .narrow #tape { display: none; }
  .narrow.embed #copy { top: 76px; will-change: transform; }
  @media (max-width: 380px) { .tall .btn { height: 38px; padding: 0 12px; font-size: 13px; } .tall .ctas { gap: 8px; flex-wrap: nowrap; } }
</style>
</head>
<body>
<div id="tape" aria-hidden="true"><img class="tlogo" src="img/logo.webp" alt=""><div class="runwrap"><div class="run" id="tapeRun"></div></div></div>
<div id="view" aria-hidden="true">
  <div id="stage">
    <img class="plate" id="plate" alt="">
    <div id="screens"></div>
    <div id="phone">
      <div class="lbl">ASK CARL</div>
      <div class="dot"></div>
      <div class="q" id="ask"></div>
    </div>
    <div id="halo" class="light"></div>
    <img id="orb" alt="">
    <canvas id="orbfx" class="light" width="300" height="300"></canvas>
    <img id="man" alt="">
    <div id="fx"></div>
    <canvas id="twinkle" class="light"></canvas>
  </div>
</div>
<div id="scrim"></div>

<section id="copy" class="ui" aria-label="Retail Investor Report">
  <img class="logo" src="img/logo.webp" alt="Retail Investor Report">
  <h1>Ask <em>Carl.</em></h1>
  <p>Every income ETF. One terminal.</p>
  <div class="ctas">
    <a class="btn btn--primary" href="https://retailinvestorreport.com" target="_top">Open Retail Investor Report</a>
    <a class="btn btn--ghost" href="/products/retail-investor-report" target="_top">How it works</a>
  </div>
</section>

<div id="stats" class="ui" aria-label="The platform in numbers">
  <div class="stat"><b data-to="450" data-fmt="{}+">0</b><span>income ETFs, live</span></div>
  <div class="stat"><b data-to="200" data-fmt="${}B+">0</b><span>fund AUM watched</span></div>
  <div class="stat"><b data-to="700" data-fmt="{}K+">0</b><span>prices behind the tools</span></div>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const root = document.documentElement;
if (qs.has("embed")) root.classList.add("embed");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));

// ---------- which desk: the wide painting, or the tall one made for phones ----------
const view = $("#view"), stage = $("#stage");
const wantTall = qs.get("desk") === "tall" || (qs.get("desk") !== "wide" && view.clientWidth / Math.max(1, view.clientHeight) < 0.8);
async function loadDesk(tall) {
  if (tall) { try { const r = await fetch("img/tall/layers.json"); if (r.ok) return { dir: "img/tall/", L: await r.json(), tall: true }; } catch {} }
  return { dir: "img/", L: await fetch("img/layers.json").then((r) => r.json()), tall: false };
}
const desk = await loadDesk(wantTall);
const L = desk.L, DIR = desk.dir;
root.classList.add(desk.tall ? "tall" : "wide", view.clientWidth / Math.max(1, view.clientHeight) < 0.8 ? "narrow" : "broad");
const [W, H] = L.size || [1360, 752];
Object.assign(stage.style, { width: W + "px", height: H + "px" });
const plate = $("#plate"); plate.src = DIR + (L.plate || "plate.webp"); Object.assign(plate.style, { width: W + "px", height: H + "px" });

// ---------- what each screen says when Carl lands on it (the platform's own words) ----------
const SHOTS = {
  "income-board": ["The Income Board", "Every income ETF in one sortable table. 450+ funds, live."],
  "backtester":   ["High Yield Terminal", "What did the fund actually do to your money? Real payouts."],
  "qdte":         ["High Yield Terminal", "Backtest the real payouts against the price erosion."],
  "head-to-head": ["Head-to-Head", "Two funds walk in. The data decides. Up to ten on one chart."],
  "factory":      ["My Income Factory", "Your portfolio as a paycheck machine. What pays next."],
  "issuers":      ["Fund Issuers", "Who runs which income funds, and who ships ghost towns."],
  "graveyard":    ["ETF Graveyard", "Every income ETF that died, kept on the record."],
  "dossier":      ["The Dossier", "The full file on any ticker. One page. Check the engine first."],
  "stage":        ["Stage Board", "The whole U.S. stock market, staged: basing to declining."],
  "etf":          ["ETF Database", "Every ETF, not just income. Lane, issuer, leverage."],
  "carl":         ["CARL", "Ask anything about any income fund. Five a day, free."],
  "newsroom":     ["The Newsroom", "Every SEC fund filing, read for what it means to you."],
  "report":       ["The Report", "One income-market story a week, done properly. Free."],
  "trends":       ["Trend Deck", "Every sector vs the S&P: how far ahead, how broadly."],
};
const ROTA = Object.assign({
  L: ["income-board", "backtester", "factory", "head-to-head", "issuers", "qdte", "graveyard", "report"],
  R: ["stage", "dossier", "carl", "etf", "newsroom", "trends"],
  C: ["backtester", "stage", "income-board", "factory"],
}, L.rota || {});

// ---------- the tape ----------
// The Income Board's yield leaders as they stood on 2026-10-07 (price, yield, latest distribution, cadence).
const TAPE = [["MRNY", "19.84", "167.65", "0.8073", "wk"], ["MSTW", "3.42", "122.40", "0.0780", "wk"], ["MSTY", "12.73", "121.46", "0.3111", "wk"],
  ["CRCO", "13.44", "97.11", "0.1940", "wk"], ["SMCY", "4.77", "92.83", "0.0824", "wk"], ["PLTW", "18.59", "88.81", "0.3550", "wk"],
  ["CONY", "19.57", "77.10", "0.2577", "wk"], ["COIW", "8.78", "76.99", "0.1210", "wk"], ["MAAY", "6.29", "76.47", "0.0890", "wk"],
  ["CRY", "18.76", "76.36", "0.2490", "wk"], ["YSPC", "42.93", "75.42", "0.4920", "wk"], ["ZVOL", "7.75", "75.10", "0.4850", "mo"]];
const BRAGS = ["Income Board · yield leaders", "450+ income ETFs", "free, not free-trial free"];
let tapeHtml = "";
TAPE.forEach(([t, px, y, d, f], i) => {
  if (i % 4 === 0) tapeHtml += `<span class="brag">${BRAGS[(i / 4) % BRAGS.length]}</span>`;
  tapeHtml += `<span><b>${t}</b><em>$${px}</em><i>${y}%</i><u>$${d}/${f}</u></span>`;
});
$("#tapeRun").innerHTML = tapeHtml + tapeHtml;
// now and then one quote lights up, the way a terminal tape ticks
const tapeCells = [...document.querySelectorAll("#tapeRun span:not(.brag)")];
if (!reduced) setInterval(() => { const c = tapeCells[Math.floor(Math.random() * tapeCells.length)]; c.classList.remove("hot"); void c.offsetWidth; c.classList.add("hot"); }, 1300);

// ---------- the tall desk (phones) draws into one canvas; the wide desk builds DOM layers ----------
if (desk.tall) {
  const { run } = await import("./tall.js");
  await run({ L, DIR, SHOTS, view, stage, reduced });
} else {
// ---------- the glass ----------
function quadMatrix(w, h, q) {
  const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = q; // TL, TR, BR, BL
  const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2;
  const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  const den = dx1 * dy2 - dx2 * dy1;
  const g = (sx * dy2 - dx2 * sy) / den, hh = (dx1 * sy - sx * dy1) / den;
  const a = x1 - x0 + g * x1, b = x3 - x0 + hh * x3, c = x0;
  const d = y1 - y0 + g * y1, e = y3 - y0 + hh * y3, f = y0;
  return `matrix3d(${[a / w, d / w, 0, g / w, b / h, e / h, 0, hh / h, 0, 0, 1, 0, c, f, 0, 1].join(",")})`;
}
// A screen is one quad (flat glass) or a run of vertical strips following a curved monitor's traced edges.
// Every strip carries the full page and shows its own slice, so the shot bends with the glass.
const ULTRA = L.shotSet === "ultra";
const BW = ULTRA ? 1280 : 1100, BH = ULTRA ? 536 : 688, PFX = ULTRA ? "ultra-" : "shot-";
const scr = {}, idx = {};
function makeScreen(k, parts) {
  const rota = ROTA[k] || ROTA.C;
  const s = { rota, imgs: [], flashes: [], parts };
  for (const pt of parts) {
    const sw = BW * (pt.u1 - pt.u0);
    const strip = document.createElement("div"); strip.className = "scr";
    Object.assign(strip.style, { width: sw + "px", height: BH + "px", transform: quadMatrix(sw, BH, pt.q) });
    const inner = document.createElement("div"); inner.className = "scr-in";
    Object.assign(inner.style, { width: BW + "px", height: BH + "px", left: -BW * pt.u0 + "px" });
    inner.innerHTML = rota.map((f, i) => `<img src="img/${PFX}${f}.webp" alt=""${i === 0 ? ' class="on"' : ""}>`).join("") + '<div class="flash"></div>';
    strip.appendChild(inner); $("#screens").appendChild(strip);
    s.imgs.push([...inner.querySelectorAll("img")]); s.flashes.push(inner.querySelector(".flash"));
  }
  // the outline of the glass, for placing flashes and callouts
  s.tl = parts[0].q[0]; s.tr = parts[parts.length - 1].q[1]; s.br = parts[parts.length - 1].q[2]; s.bl = parts[0].q[3];
  s.bottomMid = parts[Math.floor(parts.length / 2)].q[3];
  scr[k] = s; idx[k] = 0;
}
for (const [k, q] of Object.entries(L.screens)) if (k !== "phone") makeScreen(k, [{ q, u0: 0, u1: 1 }]);
for (const [k, c] of Object.entries(L.curved || {})) {
  const n = c.top.length - 1;
  makeScreen(k, Array.from({ length: n }, (_, i) => ({ q: [c.top[i], c.top[i + 1], c.bot[i + 1], c.bot[i]], u0: i / n, u1: (i + 1) / n })));
}
if (L.screens.phone) $("#phone").style.transform = quadMatrix(120, 246, L.screens.phone);
else $("#phone").remove();
function advance(k) {
  const s = scr[k]; if (!s) return null;
  const next = (idx[k] + 1) % s.rota.length;
  for (const set of s.imgs) { set[idx[k]].classList.remove("on"); set[next].classList.add("on"); }
  idx[k] = next;
  return s.rota[next];
}
const setFlash = (k, v) => scr[k] && scr[k].flashes.forEach((f) => (f.style.opacity = v));

// ---------- Carl, raised clear of the beanie ----------
// Carl floats free of the monitors: raised and scaled about his own centre
const RAISE = L.raise ?? 40, SC = L.orbScale ?? 1;
const O = { x: L.orbCentre.x, y: L.orbCentre.y - RAISE, r: L.orbCentre.r * SC };
const orbEl = $("#orb"); orbEl.src = DIR + "orb.webp";
Object.assign(orbEl.style, { left: O.x - (L.orbCentre.x - L.orb.x) * SC + "px", top: O.y - (L.orbCentre.y - L.orb.y) * SC + "px",
  width: L.orb.w * SC + "px", height: L.orb.h * SC + "px" });
// Carl alive: the looping Veo clip of his sphere (8.4 s, seamless), masked round so its sky melts into ours.
// The clip frames him at 235/720 of its width, so it is drawn 720/235 times his radius across.
const CARL_K = 720 / 235;
const carlVid = Object.assign(document.createElement("video"), { muted: true, loop: true, playsInline: true, autoplay: true, preload: "auto", src: "img/carl-loop.mp4" });
carlVid.setAttribute("muted", ""); carlVid.setAttribute("playsinline", ""); carlVid.className = "carlvid";
Object.assign(carlVid.style, { left: O.x - O.r * CARL_K / 2 + "px", top: O.y - O.r * CARL_K / 2 + "px", width: O.r * CARL_K + "px", height: O.r * CARL_K + "px" });
orbEl.after(carlVid);
carlVid.addEventListener("playing", () => { orbEl.style.visibility = "hidden"; $("#orbfx").style.visibility = "hidden"; carlVid.style.opacity = 1; });
carlVid.play().catch(() => {});
const manEl = $("#man"); manEl.src = DIR + "man.webp";
Object.assign(manEl.style, { left: L.man.x + "px", top: L.man.y + "px", width: L.man.w + "px", height: L.man.h + "px" });
const halo = $("#halo"); const HR = 190 * (O.r / 64);
Object.assign(halo.style, { left: O.x - HR + "px", top: O.y - HR + "px", width: HR * 2 + "px", height: HR * 2 + "px" });
const FXS = Math.ceil(O.r * 2.4), fxc = $("#orbfx"); fxc.width = fxc.height = FXS;
Object.assign(fxc.style, { left: O.x - FXS / 2 + "px", top: O.y - FXS / 2 + "px", width: FXS + "px", height: FXS + "px" });
// a painted halo (the tall desk has one, lifted from Gemini's render); otherwise the CSS glow does the job
const haloImg = L.halo ? Object.assign(document.createElement("img"), { src: DIR + "halo.webp", className: "light haloimg" }) : null;
if (haloImg) {
  Object.assign(haloImg.style, { position: "absolute", left: L.halo.x + "px", top: L.halo.y + "px", width: L.halo.w + "px", height: L.halo.h + "px" });
  orbEl.before(haloImg); halo.style.display = "none";
}

// ---------- strikes: a bolt sprite is placed by where it leaves Carl and where it lands ----------
const sprites = Object.fromEntries((L.bolts || []).map((b) => [b.side, b]));
const strikeList = L.placed || L.strikes || [{ screen: "L", sprite: "L", hit: [462, 400] }, { screen: "R", sprite: "R", hit: [947, 385] }];
const strikes = strikeList.map((st, i) => {
  const wrap = document.createElement("div"); wrap.className = "bolt light";
  const [hx, hy] = st.hit;
  // the reveal runs along the bolt, from Carl to the glass (CSS angle: 0deg = up)
  const toDeg = (dx, dy) => (Math.atan2(dx, -dy) * 180) / Math.PI;
  if (L.placed) {
    // a bolt Gemini painted where it belongs: placed as is
    wrap.innerHTML = `<img class="glow" src="img/${st.src}" alt=""><img src="img/${st.src}" alt="">`;
    Object.assign(wrap.style, { width: st.w + "px", height: st.h + "px", transform: `translate(${st.x}px, ${st.y}px)` });
    wrap.dataset.dir = `${toDeg(hx - O.x, hy - O.y)}deg`;
  } else {
    const sp = sprites[st.sprite];
    wrap.innerHTML = `<img class="glow" src="img/${sp.src}" alt=""><img src="img/${sp.src}" alt="">`;
    Object.assign(wrap.style, { width: sp.w + "px", height: sp.h + "px" });
    // start: Carl's rim, facing the hit point
    const dx = hx - O.x, dy = hy - O.y, dl = Math.hypot(dx, dy);
    const ax = O.x + (dx / dl) * O.r * 0.86, ay = O.y + (dy / dl) * O.r * 0.86;
    const [sx, sy] = sp.start, [ex, ey] = sp.end;
    const k = Math.hypot(hx - ax, hy - ay) / Math.hypot(ex - sx, ey - sy);
    const rot = Math.atan2(hy - ay, hx - ax) - Math.atan2(ey - sy, ex - sx);
    wrap.style.transform = `translate(${ax}px, ${ay}px) rotate(${rot}rad) scale(${k}) translate(${-sx}px, ${-sy}px)`;
    wrap.dataset.dir = `${toDeg(ex - sx, ey - sy)}deg`;
  }
  const impact = document.createElement("div"); impact.className = "impact light";
  Object.assign(impact.style, { left: hx + "px", top: hy + "px" });
  const spill = document.createElement("div"); spill.className = "spill light";
  Object.assign(spill.style, { left: (hx + O.x) / 2 + "px", top: Math.max(hy, O.y) + 40 + "px" });
  $("#fx").append(spill, wrap, impact);
  // the flash on the glass centres where the bolt lands
  const s = scr[st.screen];
  if (s) {
    const u = (hx - s.tl[0]) / (s.tr[0] - s.tl[0]), v = (hy - s.tl[1]) / (s.bl[1] - s.tl[1]);
    for (const f of s.flashes) {
      f.style.setProperty("--fx", `${Math.round(Math.min(1, Math.max(0, u)) * 100)}%`);
      f.style.setProperty("--fy", `${Math.round(Math.min(1, Math.max(0, v)) * 100)}%`);
    }
  }
  return { ...st, wrap, impact, spill, i };
});

// ---------- Carl's chat windows: one per screen, in the upper corner away from where the bolt lands ----------
const CHAT = '<div class="k"><i class="av"></i><span class="who">Carl</span><span class="tool"></span></div><div class="t"></div>';
const callouts = {};
for (const k of Object.keys(scr)) {
  const c = document.createElement("div"); c.className = "callout left"; c.innerHTML = CHAT;
  document.body.appendChild(c); callouts[k] = { el: c, until: 0, side: "left", timer: 0 };
}
function showCallout(k, shot, t, side) {
  const c = callouts[k], words = SHOTS[shot]; if (!c || !words) return;
  c.side = side; c.el.classList.remove("left", "right"); c.el.classList.add(side, "on", "typing");
  c.el.querySelector(".tool").textContent = "· " + words[0];
  c.el.querySelector(".t").textContent = words[1];
  clearTimeout(c.timer); c.timer = setTimeout(() => c.el.classList.remove("typing"), 420);
  c.until = t + 3600; placeCallouts();
}
function placeCallouts() {
  const vr = view.getBoundingClientRect();
  for (const [k, c] of Object.entries(callouts)) {
    const sc = scr[k], sw = (sc.tr[0] - sc.tl[0]) * cam.s, sh = (sc.bl[1] - sc.tl[1]) * cam.s;
    const w = Math.round(Math.min(270, sw * 0.62)); c.el.style.width = w + "px";
    const inset = Math.max(8, sw * 0.05);
    const corner = c.side === "left" ? sc.tl : sc.tr;
    let x = vr.left + cam.x + corner[0] * cam.s + (c.side === "left" ? inset : -inset - w);
    x = Math.max(8, Math.min(innerWidth - w - 8, x));
    c.el.style.left = x + "px";
    c.el.style.top = vr.top + cam.y + corner[1] * cam.s + sh * 0.16 + "px";
  }
}

// ---------- camera ----------
// cover the viewport; when the wide desk is seen narrow, follow the strike rather than crawl across
let fit = {}, cam = { x: 0, y: 0, s: 1 }, focusX = O.x, focusTarget = O.x, push = 0, pushTarget = 0, pushAt = [O.x, O.y];
function layout() {
  const pad = root.classList.contains("embed") ? 98 : 0;          // the band under the header + tape
  const vw = view.clientWidth, vh = view.clientHeight - pad;
  const s = Math.max(vw / W, vh / H);
  const rows = vh / s, cols = vw / s;
  const narrowWide = !desk.tall && vw / vh < 0.8;
  const top = Math.min(H - rows, Math.max(0, (narrowWide ? 400 : (L.focusY ?? 420)) - rows * (narrowWide ? 0.55 : (L.focusAt ?? 0.52))));
  fit = { s, rows, cols, top: Math.max(0, top - pad / s), vw, vh: vh + pad };
}
addEventListener("resize", layout); layout();
function applyCamera(dt) {
  focusX += (focusTarget - focusX) * (1 - Math.pow(0.0015, dt / 1000));
  push += (pushTarget - push) * (1 - Math.pow(0.02, dt / 1000));
  let s = fit.s, x, y = -fit.top * s;
  x = fit.cols >= W - 1 ? 0 : Math.min(0, Math.max(fit.vw - W * s, fit.vw / 2 - focusX * s));
  // a small push toward the screen Carl is striking
  const z = 1 + push * (L.push ?? (desk.tall ? 0.06 : 0.012));
  const px = x + pushAt[0] * s, py = y + pushAt[1] * s;
  x = px - (px - x) * z; y = py - (py - y) * z; s *= z;
  x = Math.min(0, Math.max(fit.vw - W * s, x)); y = Math.min(0, Math.max(fit.vh - H * s, y));
  cam = { x, y, s };
  stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
}

// ---------- Carl: breath, charge, and the motes inside the glass ----------
const fx = $("#orbfx").getContext("2d");
const MZ = O.r / 64;
const motes = Array.from({ length: 34 }, () => ({ a: rand(0, Math.PI * 2), r: rand(4, O.r * 0.78), w: rand(0.15, 0.6) * (Math.random() < 0.5 ? -1 : 1), z: rand(0.6, 1.8) * MZ, al: rand(0.15, 0.45), ph: rand(0, 6) }));
function carl(t, charge) {
  const breath = 0.5 - 0.5 * Math.cos((t / 4200) * Math.PI * 2);
  const bob = Math.sin(t / 2900) * 2.2;
  orbEl.style.transform = `translateY(${bob}px) scale(${1 + breath * 0.012 + charge * 0.03})`;
  orbEl.style.filter = `brightness(${1 + breath * 0.08 + charge * 0.45})`;
  carlVid.style.transform = `translateY(${bob}px) scale(${1 + charge * 0.03})`;
  carlVid.style.filter = charge > 0.02 ? `brightness(${1 + charge * 0.5})` : "";
  halo.style.opacity = (0.55 + breath * 0.25 + charge * 0.9).toFixed(3);
  halo.style.transform = `translateY(${bob}px) scale(${1 + charge * 0.25})`;
  if (haloImg) haloImg.style.opacity = (0.75 + breath * 0.2 + charge * 0.5).toFixed(3);
  fx.clearRect(0, 0, FXS, FXS);
  fx.save(); fx.translate(FXS / 2, FXS / 2 + bob); fx.beginPath(); fx.arc(0, 0, O.r - 6, 0, Math.PI * 2); fx.clip();
  for (const m of motes) {
    const a = m.a + (t / 1000) * m.w * (1 + charge * 3);
    const x = Math.cos(a) * m.r, y = Math.sin(a) * m.r * 0.8 + Math.sin(t / 900 + m.ph) * 3;
    fx.globalAlpha = Math.min(1, m.al * (0.7 + 0.5 * Math.sin(t / 600 + m.ph)) * (1 + charge * 1.5));
    const g = fx.createRadialGradient(x, y, 0, x, y, m.z * 3);
    g.addColorStop(0, "#EAF8FF"); g.addColorStop(1, "rgba(138,199,222,0)");
    fx.fillStyle = g; fx.beginPath(); fx.arc(x, y, m.z * 3, 0, Math.PI * 2); fx.fill();
  }
  fx.restore();
}

// ---------- the phone: a question typed to Carl, one per strike ----------
const ASKS = ["Which funds paid the most this month?", "Backtest QDTE against SPY.", "Show me the Stage Board.", "Is this yield sustainable?", "Compare MSTY and CONY."];
const askEl = $("#ask"); let askText = "", askAt = 0, askN = 0;
function phone(t) { if (askEl) askEl.textContent = askText.slice(0, Math.min(askText.length, Math.floor((t - askAt) / 55))); }

// ---------- the strike loop ----------
let live = [], nextStrike = 1400, turn = 0, count = 0;
function schedule(t) {
  count++;
  askText = ASKS[askN++ % ASKS.length]; askAt = t;
  const n = strikes.length, both = n > 1 && count % 5 === 0;
  const pick = [strikes[turn % n]]; turn++;
  if (both) { pick.push(strikes[turn % n]); turn++; }
  for (const st of pick) live.push({ st, t0: t, swapped: false });
  // the camera goes where the bolt goes
  focusTarget = pick.length > 1 ? O.x : pick[0].hit[0];
  pushAt = pick.length > 1 ? [O.x, O.y] : pick[0].hit;
  if (count % 3 === 0 && scr.C && L.centreTick !== false) setTimeout(() => advance("C"), 900);
  nextStrike = t + (desk.tall ? rand(3200, 4600) : rand(4200, 6800));
}
const CHARGE = 650, TRAVEL = 140, HOLD = 720, FADE = 420;
function strikeFrame(t) {
  let charge = 0;
  const lv = new Map();
  live = live.filter((s) => {
    const u = t - s.t0, st = s.st;
    const o = lv.get(st) || { level: 0, flash: 0, hit: 0, reach: 1 };
    lv.set(st, o);
    if (u < CHARGE) { charge = Math.max(charge, u / CHARGE); pushTarget = 0.35 * (u / CHARGE); return true; }
    const v = u - CHARGE;
    if (v < TRAVEL + HOLD) {
      charge = Math.max(charge, 1 - (v / (TRAVEL + HOLD)) * 0.6);
      o.reach = Math.min(1, v / TRAVEL);
      o.level = Math.random() < 0.18 ? rand(0.35, 0.6) : rand(0.85, 1);
      if (v >= TRAVEL) {
        const w = (v - TRAVEL) / HOLD;
        o.flash = Math.max(0, 1 - w * 1.6) * 0.75;
        o.hit = (1 - w) * rand(0.75, 1);
        pushTarget = 1;
        if (!s.swapped) {
          s.swapped = true;
          const sc = scr[st.screen], cx = sc ? (sc.tl[0] + sc.tr[0]) / 2 : O.x;
          showCallout(st.screen, advance(st.screen), t, st.hit[0] > cx ? "left" : "right");
        }
      }
      return true;
    }
    const f = (v - TRAVEL - HOLD) / FADE;
    if (f < 1) { o.level = (1 - f) * 0.7; return true; }
    pushTarget = 0;
    return false;
  });
  for (const st of strikes) {
    const o = lv.get(st) || { level: 0, flash: 0, hit: 0, reach: 1 };
    st.wrap.style.opacity = o.level.toFixed(3);
    if (o.level > 0) {
      const p = Math.round(o.reach * 115);
      const m = `linear-gradient(${st.wrap.dataset.dir}, #000 ${p - 12}%, transparent ${p}%)`;
      st.wrap.style.webkitMaskImage = m; st.wrap.style.maskImage = m;
    }
    setFlash(st.screen, o.flash.toFixed(3));
    st.impact.style.opacity = o.hit.toFixed(3);
    st.spill.style.opacity = Math.max(o.hit * 0.9, o.level * 0.35).toFixed(3);
  }
  for (const c of Object.values(callouts)) if (c.until && t > c.until) { c.el.classList.remove("on"); c.until = 0; }
  return charge;
}

// ---------- stars and city lights from the painting, twinkling ----------
const TR = L.twinkleRes || 1;
const twc = $("#twinkle"); twc.width = Math.round(W * TR); twc.height = Math.round(H * TR); Object.assign(twc.style, { width: W + "px", height: H + "px" });
const tw = twc.getContext("2d"); tw.scale(TR, TR);
const lights = (L.lights || []).map(([x, y, v]) => ({ x, y, v, f: rand(0.4, 1.6), ph: rand(0, 6.28), city: y > (L.cityY ?? 400) }));
function twinkle(t) {
  tw.clearRect(0, 0, W, H);
  const big = desk.tall ? 2.2 : 1;
  for (const p of lights) {
    const a = (p.city ? 0.22 : 0.4) * Math.pow(0.5 + 0.5 * Math.sin((t / 1000) * p.f + p.ph), 3) * (p.v / 255);
    if (a < 0.01) continue;
    const r = (p.city ? 5 : 2.4) * big;
    const g = tw.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    g.addColorStop(0, `rgba(235,245,255,${a})`); g.addColorStop(1, "rgba(235,245,255,0)");
    tw.fillStyle = g; tw.fillRect(p.x - r, p.y - r, r * 2, r * 2);
  }
}

// ---------- the receipts count up the first time the desk is on screen ----------
let counted = false;
function countUp() {
  if (counted) return; counted = true;
  const els = [...document.querySelectorAll(".stat b")], t0 = performance.now();
  const step = (now) => {
    const k = ease(Math.min(1, (now - t0) / 1600));
    for (const el of els) el.textContent = el.dataset.fmt.replace("{}", Math.round(+el.dataset.to * k));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---------- loop ----------
let running = false, last = 0;
function frame(now) {
  if (!running) return;
  const dt = Math.min(100, now - (last || now)); last = now;
  if (now > nextStrike) schedule(now);
  const charge = strikeFrame(now);
  applyCamera(dt);
  placeCallouts();
  carl(now, charge);
  twinkle(now);
  manEl.style.transform = `scaleY(${1 + 0.0035 * Math.sin((now / 4200) * Math.PI * 2)})`;
  phone(now);
  requestAnimationFrame(frame);
}
function start() { if (running || reduced) return; running = true; last = 0; countUp(); carlVid.play().catch(() => {}); requestAnimationFrame(frame); }
function stop() { running = false; carlVid.pause(); }
document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
// the portfolio carousel tells the scene when it is on screen
addEventListener("message", (e) => {
  if (e.origin !== location.origin) return;
  if (e.data === "scene:pause") stop();
  if (e.data === "scene:play") start();
});
// the homepage scroll drives the strikes (Lenny 10-08): left screen, right screen, then both
let lastA = 0;
function strikeWide(list) {
  const t = performance.now(); count++;
  askText = ASKS[askN++ % ASKS.length]; askAt = t;
  for (const st of list) live.push({ st, t0: t, swapped: false });
  focusTarget = list.length > 1 ? O.x : list[0].hit[0];
  pushAt = list.length > 1 ? [O.x, O.y] : list[0].hit;
  if (count % 3 === 0 && scr.C && L.centreTick !== false) setTimeout(() => advance("C"), 900);
}
addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data || e.data.scene !== "scroll") return;
  nextStrike = Infinity;
  const a = Math.max(0, Math.min(1, +e.data.a || 0));
  [0, 1, 2, 3, 4, 5].forEach((k) => {
    const th = (k + 0.5) / 6;
    if ((lastA < th) !== (a < th)) strikeWide(k === 4 ? strikes.slice(0, 2) : [strikes[k % 2 % strikes.length]]);
  });
  lastA = a;
});
plate.decode().catch(() => {}).then(() => root.classList.add("ready"));
if (reduced) {
  applyCamera(16); carl(0, 0); if (askEl) askEl.textContent = ASKS[0];
  document.querySelectorAll(".stat b").forEach((el) => (el.textContent = el.dataset.fmt.replace("{}", el.dataset.to)));
} else start();
}
</script>
