<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carl on the desk</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; }
  body { display: grid; place-items: center; }
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 1360 / 752));
    aspect-ratio: 1360 / 752;
    overflow: hidden;
    perspective: 1100px;
  }
  .plate { width: 100%; height: 100%; display: block; }
  .logo {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 1.6%;
    width: 62%;
    height: auto;
    transform: translateX(-50%);
    pointer-events: none;
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .55));
  }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 40;
  }
  .fan { position: absolute; inset: 0; pointer-events: none; }
  .card {
    position: absolute;
    width: 25.2%;
    height: 23.8%;
    border-radius: 2.4%;
    overflow: hidden;
    background: #071018;
    box-shadow:
      0 22px 36px rgba(0, 0, 0, .5),
      inset 0 0 0 1px rgba(186, 220, 236, .42);
  }
  #income .card { transform-origin: 100% 58%; }
  #market .card { transform-origin: 0% 58%; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap {
    position: absolute;
    z-index: 6;
    margin: 0;
    width: 25%;
    text-align: center;
    font-family: "Segoe UI", sans-serif;
    font-size: clamp(11px, 1.35vw, 18px);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #e7f6ff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .85);
    pointer-events: none;
    transition: opacity .35s ease;
  }
  #cap-income { left: 7%; top: 71.5%; }
  #cap-market { left: 67.8%; top: 71.5%; }
</style>
</head>
<body>
  <div class="stage">
    <img class="plate" src="plate.jpg" alt="A man at a desk at night, with an empty gold star ring in the window.">
    <img class="logo" src="logo.png" alt="Retail Investor Report">
    <div class="fan" id="income">
      <div class="card" data-name="Performance Backtester"><img src="income/backtester.png" alt="Performance Backtester"></div>
      <div class="card" data-name="The Income Board"><img src="income/board.png" alt="The Income Board"></div>
      <div class="card" data-name="Head to Head"><img src="income/head-to-head.png" alt="Head to head"></div>
      <div class="card" data-name="Fund Issuers"><img src="income/issuers.png" alt="Fund issuers"></div>
      <div class="card" data-name="Your Income Factory"><img src="income/factory.png" alt="Your Income Factory"></div>
    </div>
    <div class="fan" id="market">
      <div class="card" data-name="The Dossier"><img src="market/dossier.png" alt="The Dossier"></div>
      <div class="card" data-name="Stage Board"><img src="market/stage.png" alt="Stage Board"></div>
      <div class="card" data-name="META vs GOOGL"><img src="market/charts.png" alt="META versus GOOGL"></div>
      <div class="card" data-name="Compare"><img src="market/compare.png" alt="Compare two stocks"></div>
      <div class="card" data-name="ETF Database"><img src="market/etf.png" alt="The ETF Database"></div>
    </div>
    <p class="cap" id="cap-income"></p>
    <p class="cap" id="cap-market"></p>
    <canvas id="fx"></canvas>
  </div>
<script>
/* Carl is drawn once, centered in the gold ring. The screens are real product
   shots, turned in toward the chair. The front card of each fan cycles back. */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const stage = document.querySelector('.stage');
const cv = document.getElementById('fx');
const ctx = cv.getContext('2d');
let DPR = 1, W = 1, H = 1;

const orb = { x: 0.50, y: 0.255, r: 0.068, breathT: 0 };
const TARGETS = [
  { x: 0.18, y: 0.56 },
  { x: 0.80, y: 0.56 },
  { x: 0.50, y: 0.40 }
];

const N_INNER = 48;
const inner = [];
for (let i = 0; i < N_INNER; i++) inner.push({
  a: rand(.25, .8), b: rand(.25, .8),
  f1: rand(.10, .30), f2: rand(.10, .30), p1: rand(0, TAU), p2: rand(0, TAU),
  r: rand(1.0, 2.2), hot: Math.random() < .25, al: rand(.14, .32)
});

let t0 = performance.now();

function resize() {
  const r = stage.getBoundingClientRect();
  DPR = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
}
addEventListener('resize', resize);
resize();

function drawOrb(t) {
  const breath = 0.5 - 0.5 * Math.cos(TAU * orb.breathT);
  let dy = 0, dxx = 0;
  if (!REDUCED) {
    dy = 4 * Math.sin(TAU * t / 9);
    dxx = 2 * Math.sin(TAU * t / 14.6 + 1.3);
  }
  const x = orb.x * W + dxx;
  const y = orb.y * H + dy;
  const r = orb.r * H;
  const cx = x * DPR, cy = y * DPR, R = r * DPR;

  let hg = ctx.createRadialGradient(cx, cy, R * 0.7, cx, cy, R * 1.28);
  hg.addColorStop(0, 'rgba(120,186,214,' + (0.16 + breath * 0.06).toFixed(3) + ')');
  hg.addColorStop(1, 'rgba(120,186,214,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(cx, cy, R * 1.28, 0, TAU); ctx.fill();

  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.fillStyle = '#0B0E14'; ctx.fill();

  const coreB = 0.55 + breath * 0.12;
  let cg = ctx.createRadialGradient(cx, cy - R * 0.08, 0, cx, cy, R * 0.96);
  cg.addColorStop(0, 'rgba(214,236,246,' + coreB.toFixed(3) + ')');
  cg.addColorStop(0.28, 'rgba(110,186,214,0.85)');
  cg.addColorStop(0.62, 'rgba(36,110,140,0.75)');
  cg.addColorStop(1, 'rgba(11,14,20,0.2)');
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  ctx.fillStyle = cg; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  if (!REDUCED) {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of inner) {
      const px = p.a * Math.sin(p.f1 * TAU * t + p.p1);
      const py = p.b * Math.sin(p.f2 * TAU * t + p.p2);
      ctx.globalAlpha = p.al * (0.75 + breath * 0.25);
      ctx.fillStyle = p.hot ? '#d7eef8' : '#7ebbd4';
      ctx.beginPath();
      ctx.arc(cx + px * R * 0.7, cy + py * R * 0.7, p.r * DPR, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  const rimA = clamp(0.28 + breath * 0.22, 0.1, 0.6);
  ctx.save();
  ctx.shadowColor = 'rgba(120,190,214,' + rimA.toFixed(3) + ')';
  ctx.shadowBlur = (8 + breath * 6) * DPR;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.strokeStyle = 'rgba(150,205,224,' + rimA.toFixed(3) + ')';
  ctx.lineWidth = 1.6 * DPR;
  ctx.stroke();
  ctx.restore();
  return { x, y, r };
}

function drawBolt(i, a, sx, sy, ex, ey) {
  let dx = ex - sx, dy = ey - sy;
  const d = Math.hypot(dx, dy) || 1;
  dx /= d; dy /= d;
  const mx = (sx + ex) / 2 - dy * d * 0.16;
  const my = (sy + ey) / 2 + dx * d * 0.16;
  let alpha;
  if (a < 0.15) alpha = a / 0.15;
  else if (a < 1.35) alpha = 1;
  else alpha = 1 - (a - 1.35) / 0.4;

  const crackle = Math.floor(a * 14);
  const rnd = (k) => {
    const v = Math.sin((i * 97.13 + k * 41.77 + crackle * 13.31)) * 43758.5453;
    return v - Math.floor(v);
  };
  const SEG = 16;
  const pts = [];
  for (let k = 0; k <= SEG; k++) {
    const u = k / SEG, iu = 1 - u;
    const bx = iu * iu * sx + 2 * iu * u * mx + u * u * ex;
    const by = iu * iu * sy + 2 * iu * u * my + u * u * ey;
    const amp = Math.min(22, d * 0.11) * Math.sin(Math.PI * u);
    const j = (rnd(k) - 0.5) * 2 * amp;
    pts.push([bx - dy * j, by + dx * j]);
  }
  const trace = () => {
    ctx.beginPath();
    ctx.moveTo(pts[0][0] * DPR, pts[0][1] * DPR);
    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0] * DPR, pts[k][1] * DPR);
    ctx.stroke();
  };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = alpha * 0.18; ctx.strokeStyle = '#6FB6D8'; ctx.lineWidth = 5 * DPR;
  ctx.shadowColor = '#8AC7DE'; ctx.shadowBlur = 10 * DPR; trace();
  ctx.globalAlpha = alpha * 0.7; ctx.strokeStyle = '#9FD8EE'; ctx.lineWidth = 1.7 * DPR;
  ctx.shadowBlur = 6 * DPR; trace();
  ctx.globalAlpha = alpha * 0.9; ctx.strokeStyle = '#EAF7FF'; ctx.lineWidth = 0.8 * DPR;
  ctx.shadowBlur = 0; trace();

  ctx.globalAlpha = alpha * 0.4; ctx.strokeStyle = '#9FD8EE'; ctx.lineWidth = 1 * DPR;
  for (let f = 0; f < 2; f++) {
    const at = 4 + Math.floor(rnd(90 + f) * (SEG - 8));
    const [px0, py0] = pts[at];
    const len = 8 + rnd(70 + f) * 16;
    const ang = Math.atan2(pts[at + 1][1] - py0, pts[at + 1][0] - px0) + (rnd(50 + f) - 0.5) * 1.6;
    ctx.beginPath();
    ctx.moveTo(px0 * DPR, py0 * DPR);
    ctx.lineTo((px0 + Math.cos(ang) * len * 0.55) * DPR, (py0 + Math.sin(ang) * len * 0.55) * DPR);
    ctx.lineTo((px0 + Math.cos(ang) * len) * DPR, (py0 + Math.sin(ang) * len) * DPR);
    ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

function Fan(selector, capId, slots, phaseMs) {
  const cards = Array.from(document.querySelectorAll(selector + ' .card'));
  const cap = document.getElementById(capId);
  const order = cards.map((_, i) => i);
  const HOLD = 5.4, MOVE = 1.2;
  let mode = 'hold';
  let modeAt = performance.now() - phaseMs;
  const ease = (p) => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  const lerp = (a, b, p) => a + (b - a) * p;
  const paint = (el, s, z) => {
    el.style.left = s.x + '%';
    el.style.top = s.y + '%';
    el.style.zIndex = String(z);
    el.style.filter = 'brightness(' + s.b.toFixed(3) + ')';
    el.style.transform = 'rotateY(' + s.ry.toFixed(2) + 'deg) rotateX(' + s.rx.toFixed(2) + 'deg)';
  };
  const nameOf = () => { cap.textContent = cards[order[0]].dataset.name; cap.style.opacity = '1'; };
  const rest = () => {
    order.forEach((cardIndex, slot) => paint(cards[cardIndex], slots[slot], slots[slot].z));
    nameOf();
  };
  const move = (raw) => {
    const e = ease(raw);
    const back = slots.length - 1;
    cap.style.opacity = raw < 0.25 || raw > 0.8 ? '1' : '0.15';
    order.forEach((cardIndex, slot) => {
      const el = cards[cardIndex];
      if (slot === 0) {
        const a = slots[0], b = slots[back];
        const lift = Math.sin(Math.PI * raw) * 2.2;
        paint(el, {
          x: lerp(a.x, b.x, e),
          y: lerp(a.y, b.y, e) - lift,
          ry: lerp(a.ry, b.ry, e),
          rx: lerp(a.rx, b.rx, e),
          b: lerp(a.b, b.b, e)
        }, raw < 0.78 ? 60 : 2);
      } else {
        const q = ease(Math.min(1, Math.max(0, (raw - 0.16) / 0.84)));
        const a = slots[slot], b = slots[slot - 1];
        paint(el, {
          x: lerp(a.x, b.x, q),
          y: lerp(a.y, b.y, q),
          ry: lerp(a.ry, b.ry, q),
          rx: lerp(a.rx, b.rx, q),
          b: lerp(a.b, b.b, q)
        }, b.z);
      }
    });
  };
  rest();
  return function tick(now) {
    if (REDUCED) { rest(); return; }
    const elapsed = (now - modeAt) / 1000;
    if (mode === 'hold') {
      rest();
      if (elapsed >= HOLD) { mode = 'move'; modeAt = now; }
      return;
    }
    const raw = Math.min(1, elapsed / MOVE);
    move(raw);
    if (raw >= 1) {
      order.push(order.shift());
      mode = 'hold';
      modeAt = now;
      rest();
    }
  };
}

const income = Fan('#income', 'cap-income', [
  { x: 6.4, y: 44.6, ry: 34, rx: 8, z: 50, b: 1 },
  { x: 3.6, y: 39.8, ry: 42, rx: 10, z: 40, b: 0.78 },
  { x: 1.2, y: 35.2, ry: 48, rx: 12, z: 30, b: 0.64 },
  { x: -0.6, y: 31.0, ry: 54, rx: 13, z: 20, b: 0.54 },
  { x: -2.0, y: 27.2, ry: 58, rx: 14, z: 10, b: 0.46 }
], 0);

const market = Fan('#market', 'cap-market', [
  { x: 68.4, y: 44.6, ry: -34, rx: 8, z: 50, b: 1 },
  { x: 71.0, y: 39.8, ry: -42, rx: 10, z: 40, b: 0.78 },
  { x: 73.2, y: 35.2, ry: -48, rx: 12, z: 30, b: 0.64 },
  { x: 75.0, y: 31.0, ry: -54, rx: 13, z: 20, b: 0.54 },
  { x: 76.4, y: 27.2, ry: -58, rx: 14, z: 10, b: 0.46 }
], 3200);

function frame(now) {
  const t = (now - t0) / 1000;
  orb.breathT = (t % 4) / 4;
  income(now);
  market(now);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const o = drawOrb(t);
  if (!REDUCED) {
    for (let n = 0; n < 2; n++) {
      const cycle = 1.9;
      const start = t - n * (cycle / 2);
      const idx = Math.floor(start / cycle);
      const a = start - idx * cycle;
      if (a < 0) continue;
      const tgt = TARGETS[((idx % TARGETS.length) + TARGETS.length) % TARGETS.length];
      const ex = tgt.x * W, ey = tgt.y * H;
      let dx = ex - o.x, dy = ey - o.y;
      const d = Math.hypot(dx, dy) || 1;
      drawBolt(idx + n * 17, a, o.x + dx / d * o.r, o.y + dy / d * o.r, ex, ey);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
