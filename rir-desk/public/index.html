<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carl on the desk</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; }
  body { display: grid; place-items: center; }
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 1376 / 768));
    aspect-ratio: 1376 / 768;
    overflow: hidden;
  }
  .plate { width: 100%; height: 100%; display: block; }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 80;
  }
  .fan { position: absolute; inset: 0; pointer-events: none; }
  .card {
    position: absolute;
    width: 29.07%;
    height: 27.34%;
    border-radius: 3.4%;
    overflow: hidden;
    background: #070d16;
    box-shadow:
      0 16px 32px rgba(0, 0, 0, .48),
      inset 0 0 0 1px rgba(186, 220, 236, .5);
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .phone {
    position: absolute;
    left: 66.86%;
    top: 62.24%;
    width: 7.56%;
    height: auto;
    z-index: 70;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="plate" src="plate.png" alt="Desk scene. Carl floats above the monitor. Income tools cycle on the left, market tools on the right.">
    <div class="fan" id="income">
      <div class="card"><img src="income/backtester.png" alt="Performance Backtester"></div>
      <div class="card"><img src="income/board.png" alt="The Income Board"></div>
      <div class="card"><img src="income/head-to-head.png" alt="Head to head"></div>
      <div class="card"><img src="income/issuers.png" alt="Fund issuers"></div>
      <div class="card"><img src="income/factory.png" alt="Your Income Factory"></div>
    </div>
    <div class="fan" id="market">
      <div class="card"><img src="market/dossier.png" alt="The Dossier"></div>
      <div class="card"><img src="market/stage.png" alt="Stage Board"></div>
      <div class="card"><img src="market/charts.png" alt="META versus GOOGL"></div>
      <div class="card"><img src="market/compare.png" alt="Compare two stocks"></div>
      <div class="card"><img src="market/etf.png" alt="The ETF Database"></div>
    </div>
    <img class="phone" src="phone.png" alt="">
    <canvas id="fx"></canvas>
  </div>
<script>
/* Orb and bolts transplanted from the Carl chat. The two fans are the real
   product screens: the front card of each stack cycles to the back. */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const stage = document.querySelector('.stage');
const cv = document.getElementById('fx');
const ctx = cv.getContext('2d');
let DPR = 1, W = 1, H = 1;

const orb = { x: 0.50, y: 0.31, r: 0.105, breathT: 0 };
const TARGETS = [
  { x: 0.224, y: 0.590 },
  { x: 0.776, y: 0.587 },
  { x: 0.50, y: 0.60 },
  { x: 0.705, y: 0.73 }
];

const N_INNER = 60;
const inner = [];
for (let i = 0; i < N_INNER; i++) inner.push({
  a: rand(.3, .92), b: rand(.3, .92),
  f1: rand(.10, .34), f2: rand(.10, .34), p1: rand(0, TAU), p2: rand(0, TAU),
  r: rand(1.2, 2.7), hot: Math.random() < .3, al: rand(.18, .42)
});

let t0 = performance.now();

function resize() {
  const r = stage.getBoundingClientRect();
  DPR = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
}
addEventListener('resize', resize);
resize();

function drawOrb(t) {
  const breath = 0.5 - 0.5 * Math.cos(TAU * orb.breathT);
  let dy = 0, dxx = 0;
  if (!REDUCED) {
    dy = 6 * Math.sin(TAU * t / 9);
    dxx = 3 * Math.sin(TAU * t / 14.6 + 1.3);
  }
  const x = orb.x * W + dxx;
  const y = orb.y * H + dy;
  const r = orb.r * H;
  const cx = x * DPR, cy = y * DPR, R = r * DPR;

  let hg = ctx.createRadialGradient(cx, cy, R * 0.8, cx, cy, R * 1.9);
  hg.addColorStop(0, 'rgba(138,199,232,' + (0.28 + breath * 0.1).toFixed(3) + ')');
  hg.addColorStop(1, 'rgba(138,199,222,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(cx, cy, R * 1.9, 0, TAU); ctx.fill();

  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.fillStyle = '#0B0E14'; ctx.fill();

  const coreB = 0.88 + breath * 0.12;
  let cg = ctx.createRadialGradient(cx, cy - R * 0.06, 0, cx, cy - R * 0.06, R * 0.96);
  cg.addColorStop(0, 'rgba(236,248,255,' + coreB.toFixed(3) + ')');
  cg.addColorStop(0.22, 'rgba(138,199,222,' + Math.min(1, coreB).toFixed(3) + ')');
  cg.addColorStop(0.5, 'rgba(70,150,180,0.9)');
  cg.addColorStop(1, 'rgba(11,14,20,0.15)');
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  ctx.fillStyle = cg; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  if (!REDUCED) {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of inner) {
      const px = p.a * Math.sin(p.f1 * TAU * t + p.p1);
      const py = p.b * Math.sin(p.f2 * TAU * t + p.p2);
      ctx.globalAlpha = p.al * (0.8 + breath * 0.3);
      ctx.fillStyle = p.hot ? '#E4F4FF' : '#8AC7DE';
      ctx.beginPath();
      ctx.arc(cx + px * R * 0.72, cy + py * R * 0.72, p.r * DPR, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.86, -2.62, -1.98);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = Math.max(1.5, R * 0.055);
  ctx.lineCap = 'round';
  ctx.stroke();

  const rimA = clamp(0.30 + breath * 0.42, 0.06, 1);
  ctx.save();
  ctx.shadowColor = 'rgba(138,199,222,' + (rimA * 0.9).toFixed(3) + ')';
  ctx.shadowBlur = (16 + breath * 14) * DPR;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.strokeStyle = 'rgba(138,199,222,' + rimA.toFixed(3) + ')';
  ctx.lineWidth = 2 * DPR;
  ctx.stroke();
  ctx.restore();
  return { x, y, r };
}

function drawBolt(i, a, sx, sy, ex, ey) {
  let dx = ex - sx, dy = ey - sy;
  const d = Math.hypot(dx, dy) || 1;
  dx /= d; dy /= d;
  const mx = (sx + ex) / 2 - dy * d * 0.16;
  const my = (sy + ey) / 2 + dx * d * 0.16;
  let alpha;
  if (a < 0.15) alpha = a / 0.15;
  else if (a < 1.35) alpha = 1;
  else alpha = 1 - (a - 1.35) / 0.4;

  const crackle = Math.floor(a * 14);
  const rnd = (k) => {
    const v = Math.sin((i * 97.13 + k * 41.77 + crackle * 13.31)) * 43758.5453;
    return v - Math.floor(v);
  };
  const SEG = 16;
  const pts = [];
  for (let k = 0; k <= SEG; k++) {
    const u = k / SEG, iu = 1 - u;
    const bx = iu * iu * sx + 2 * iu * u * mx + u * u * ex;
    const by = iu * iu * sy + 2 * iu * u * my + u * u * ey;
    const amp = Math.min(26, d * 0.13) * Math.sin(Math.PI * u);
    const j = (rnd(k) - 0.5) * 2 * amp;
    pts.push([bx - dy * j, by + dx * j]);
  }
  const trace = () => {
    ctx.beginPath();
    ctx.moveTo(pts[0][0] * DPR, pts[0][1] * DPR);
    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0] * DPR, pts[k][1] * DPR);
    ctx.stroke();
  };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = alpha * 0.20; ctx.strokeStyle = '#6FB6D8'; ctx.lineWidth = 6 * DPR;
  ctx.shadowColor = '#8AC7DE'; ctx.shadowBlur = 14 * DPR; trace();
  ctx.globalAlpha = alpha * 0.75; ctx.strokeStyle = '#9FD8EE'; ctx.lineWidth = 2.1 * DPR;
  ctx.shadowBlur = 8 * DPR; trace();
  ctx.globalAlpha = alpha * 0.95; ctx.strokeStyle = '#EAF7FF'; ctx.lineWidth = 0.9 * DPR;
  ctx.shadowBlur = 0; trace();

  ctx.globalAlpha = alpha * 0.45; ctx.strokeStyle = '#9FD8EE'; ctx.lineWidth = 1 * DPR;
  for (let f = 0; f < 2; f++) {
    const at = 4 + Math.floor(rnd(90 + f) * (SEG - 8));
    const [px0, py0] = pts[at];
    const len = 8 + rnd(70 + f) * 20;
    const ang = Math.atan2(pts[at + 1][1] - py0, pts[at + 1][0] - px0) + (rnd(50 + f) - 0.5) * 1.8;
    ctx.beginPath();
    ctx.moveTo(px0 * DPR, py0 * DPR);
    ctx.lineTo((px0 + Math.cos(ang) * len * 0.55 + (rnd(60 + f) - 0.5) * 8) * DPR,
               (py0 + Math.sin(ang) * len * 0.55 + (rnd(65 + f) - 0.5) * 8) * DPR);
    ctx.lineTo((px0 + Math.cos(ang) * len) * DPR, (py0 + Math.sin(ang) * len) * DPR);
    ctx.stroke();
  }
  const strike = a < 0.2 ? 1 - a / 0.2 : 0;
  if (strike > 0) {
    const fg = ctx.createRadialGradient(ex * DPR, ey * DPR, 0, ex * DPR, ey * DPR, 26 * DPR * strike + 2);
    fg.addColorStop(0, 'rgba(234,247,255,' + (0.85 * strike * alpha).toFixed(3) + ')');
    fg.addColorStop(1, 'rgba(138,199,222,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(ex * DPR, ey * DPR, 26 * DPR * strike + 2, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = alpha * 0.95;
  ctx.fillStyle = '#EAF7FF'; ctx.shadowColor = '#8AC7DE'; ctx.shadowBlur = 10 * DPR;
  ctx.beginPath(); ctx.arc(ex * DPR, ey * DPR, 1.8 * DPR, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

/* Front card is slot 0. A cycle sends it to the back of its own fan. */
function Fan(selector, slots, spin, phaseMs) {
  const cards = Array.from(document.querySelectorAll(selector + ' .card'));
  const order = cards.map((_, i) => i);
  const HOLD = 5.6, MOVE = 1.15;
  let mode = 'hold';
  let modeAt = performance.now() - phaseMs;
  const ease = (p) => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  const lerp = (a, b, p) => a + (b - a) * p;
  const paint = (el, s, z, rot) => {
    el.style.left = s.x + '%';
    el.style.top = s.y + '%';
    el.style.zIndex = String(z);
    el.style.transform = 'rotate(' + rot.toFixed(2) + 'deg)';
    el.style.filter = 'brightness(' + s.b.toFixed(3) + ')';
  };
  const rest = () => {
    order.forEach((cardIndex, slot) => paint(cards[cardIndex], slots[slot], slots[slot].z, 0));
  };
  const move = (raw) => {
    const e = ease(raw);
    const back = slots.length - 1;
    order.forEach((cardIndex, slot) => {
      const el = cards[cardIndex];
      if (slot === 0) {
        const a = slots[0], b = slots[back];
        const lift = Math.sin(Math.PI * raw) * 1.4;
        paint(el, {
          x: lerp(a.x, b.x, e),
          y: lerp(a.y, b.y, e) - lift,
          b: lerp(a.b, b.b, e)
        }, raw < 0.82 ? 60 : 2, Math.sin(Math.PI * raw) * spin);
      } else {
        const q = ease(Math.min(1, Math.max(0, (raw - 0.18) / 0.82)));
        const a = slots[slot], b = slots[slot - 1];
        paint(el, {
          x: lerp(a.x, b.x, q),
          y: lerp(a.y, b.y, q),
          b: lerp(a.b, b.b, q)
        }, b.z, 0);
      }
    });
  };
  rest();
  return function tick(now) {
    if (REDUCED) { rest(); return; }
    const elapsed = (now - modeAt) / 1000;
    if (mode === 'hold') {
      rest();
      if (elapsed >= HOLD) { mode = 'move'; modeAt = now; }
      return;
    }
    const raw = Math.min(1, elapsed / MOVE);
    move(raw);
    if (raw >= 1) {
      order.push(order.shift());
      mode = 'hold';
      modeAt = now;
      rest();
    }
  };
}

const income = Fan('#income', [
  { x: 7.85, y: 45.31, z: 50, b: 1 },
  { x: 6.10, y: 42.19, z: 40, b: 0.82 },
  { x: 4.36, y: 39.06, z: 30, b: 0.70 },
  { x: 2.62, y: 35.94, z: 20, b: 0.60 },
  { x: 0.87, y: 33.07, z: 10, b: 0.52 }
], -3.5, 0);

const market = Fan('#market', [
  { x: 63.08, y: 45.05, z: 50, b: 1 },
  { x: 64.97, y: 41.93, z: 40, b: 0.82 },
  { x: 66.86, y: 38.80, z: 30, b: 0.70 },
  { x: 68.75, y: 35.68, z: 20, b: 0.60 },
  { x: 70.64, y: 32.55, z: 10, b: 0.52 }
], 3.5, 3400);

function frame(now) {
  const t = (now - t0) / 1000;
  orb.breathT = (t % 4) / 4;
  income(now);
  market(now);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const o = drawOrb(t);
  if (!REDUCED) {
    for (let n = 0; n < 2; n++) {
      const cycle = 1.75;
      const start = t - n * (cycle / 2);
      const idx = Math.floor(start / cycle);
      const a = start - idx * cycle;
      if (a < 0) continue;
      const tgt = TARGETS[((idx % TARGETS.length) + TARGETS.length) % TARGETS.length];
      const ex = tgt.x * W, ey = tgt.y * H;
      let dx = ex - o.x, dy = ey - o.y;
      const d = Math.hypot(dx, dy) || 1;
      drawBolt(idx + n * 17, a, o.x + dx / d * o.r, o.y + dy / d * o.r, ex, ey);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
