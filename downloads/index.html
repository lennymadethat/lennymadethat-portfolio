<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloads — Lenny Made That</title>
  <meta name="description" content="Every agent and tool Lenny Made That gives away: Agent Sell Stuff, Harry the Harvester, the Ingester, Second Brain, Mothership, Skills and the PlayLetter app. Free on GitHub." />
  <link rel="canonical" href="https://lennymadethat.com/downloads" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lenny Made That" />
  <meta property="og:title" content="Downloads — Lenny Made That" />
  <meta property="og:description" content="Every agent and tool, free on GitHub." />
  <meta property="og:url" content="https://lennymadethat.com/downloads" />
  <meta property="og:image" content="https://lennymadethat.com/img/agents/sellstuff/explainer-1.webp" />
  <meta name="theme-color" content="#07080f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314181B'/%3E%3Crect x='7' y='20' width='18' height='4' fill='%2356C2FF'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* The download wall: every agent with a face, every tool with its logo, each tile one tap from its GitHub. */
    :root {
      --void: #07080f; --panel: #0f1220; --edge: rgba(170,200,255,.16); --ink: #eef3fb; --soft: #c5d0df; --dim: #93a2b8;
      --blue: #56c2ff;
      --display: "Oxanium", system-ui, sans-serif; --body: "Barlow", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(ellipse at 50% -10%, #1b1640 0%, var(--void) 55%) fixed, var(--void); color: var(--ink); font: 400 17px/1.55 var(--body); }
    a { color: inherit; }
    .wrap { width: min(1200px, 100%); margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }
    .top { position: sticky; top: 0; z-index: 10; background: rgba(7,8,15,.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--edge); }
    .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
    .brand { font: 800 15px/1 var(--display); letter-spacing: .14em; text-decoration: none; }
    .back { font: 600 13px/1 var(--mono); letter-spacing: .08em; color: var(--soft); text-decoration: none; }
    .back:hover { color: var(--blue); }

    header.hero { padding-block: clamp(20px, 3.5vh, 40px) clamp(14px, 2.5vh, 26px); display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
    .eyebrow { font: 600 12px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--blue); margin: 0 0 6px; }
    h1 { font: 800 clamp(30px, 4vw, 52px)/.95 var(--display); text-transform: uppercase; margin: 0; }
    .lede { font-size: 15.5px; color: var(--soft); max-width: 46ch; margin: 0; }

    /* all nine on one screen: 3 x 3 compact tiles */
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tile { --t: var(--blue); display: grid; grid-template-columns: clamp(96px, 9vw, 132px) 1fr; background: linear-gradient(180deg, rgba(255,255,255,.035), transparent 60%), var(--panel);
      border: 1px solid var(--edge); border-radius: 14px; overflow: hidden; min-height: clamp(150px, 22vh, 210px); transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
    .tile:hover, .tile:focus-within { transform: translateY(-2px); border-color: color-mix(in srgb, var(--t) 60%, transparent); box-shadow: 0 12px 34px rgba(0,0,0,.4), 0 0 26px color-mix(in srgb, var(--t) 18%, transparent); }
    .face { position: relative; display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(ellipse at 50% 90%, color-mix(in srgb, var(--t) 45%, transparent) 0%, transparent 65%), linear-gradient(180deg, #0b0d19, #141833); }
    .face img.char { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 100%; width: auto; max-width: none; filter: drop-shadow(0 0 12px color-mix(in srgb, var(--t) 40%, transparent)); }
    .face img.logo { width: 68%; height: auto; aspect-ratio: 1; object-fit: contain; border-radius: 18px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.5)); }
    .face svg.logo { width: 68%; height: auto; }
    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .kind { align-self: flex-start; font: 600 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--t);
      border: 1px solid color-mix(in srgb, var(--t) 45%, transparent); padding: 4px 7px; border-radius: 999px; margin-bottom: 4px; }
    .body h3 { font: 800 clamp(17px, 1.5vw, 21px)/1.1 var(--display); text-transform: uppercase; margin: 0; }
    .line { font: 500 14.5px/1.35 var(--body); color: var(--soft); margin: 0; }
    .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 10px; }
    .btn { display: inline-flex; align-items: center; gap: 7px; font: 700 12px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; padding: 9px 11px; border-radius: 6px; }
    .btn--main { background: var(--t); color: #08101c; }
    .btn--ghost { border: 1px solid var(--edge); color: var(--ink); }
    .btn:hover, .btn:focus-visible { filter: brightness(1.12); outline: 2px solid var(--ink); outline-offset: 2px; }
    .btn svg { width: 14px; height: 14px; }
    @media (max-width: 1050px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) {
      header.hero { padding-block: 16px 12px; } h1 { font-size: 30px; } .lede { font-size: 14px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .tile { grid-template-columns: 1fr; grid-template-rows: auto 1fr; min-height: 0; border-radius: 12px; }
      .face { height: 24vw; }
      .face img.logo, .face svg.logo { width: auto; height: 62%; max-width: 62%; }
      .body { padding: 8px 8px 10px; gap: 2px; text-align: center; }
      .kind, .line, .btn--ghost { display: none; }
      .body h3 { font-size: 12.5px; line-height: 1.15; min-height: 2.3em; display: grid; place-items: center; }
      .acts { justify-content: center; padding-top: 6px; }
      .btn--main { width: 100%; justify-content: center; padding: 8px 4px; font-size: 10.5px; }
      footer { padding-block: 14px; font-size: 11px; }
    }
    @media (min-width: 641px) and (max-height: 760px) { .tile { min-height: 0; } .body { padding-block: 10px; } header.hero { padding-block: 14px 12px; } }
    footer { padding-block: 22px 24px; color: var(--dim); font: 500 13px/1.6 var(--mono); }
  </style>
</head>
<body>
  <header class="top"><div class="wrap">
    <a class="brand" href="/">LENNY MADE THAT</a>
    <a class="back" href="/#agents">← Back to the site</a>
  </div></header>

  <main class="wrap">
    <header class="hero">
      <div><p class="eyebrow">Downloads</p><h1>Take them home</h1></div>
      <p class="lede">Every agent and tool I give away. Free on GitHub, each with a setup guide any coding agent can follow.</p>
    </header>
    <div class="grid" id="all"></div>
  </main>
  <footer><div class="wrap">Lenny Made That · everything here is MIT-licensed unless the repo says otherwise.</div></footer>

  <script>
    const GH = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
    const SKILLS = '<svg class="logo" viewBox="0 0 108 108" aria-hidden="true"><rect x="4" y="4" width="100" height="100" rx="22" fill="#141a33" stroke="#56c2ff" stroke-opacity=".5"/><path d="M30 38l14 14-14 14" fill="none" stroke="#56c2ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 70h26" stroke="#eef3fb" stroke-width="7" stroke-linecap="round"/></svg>';
    const D = {
      agents: [
        { name: "Agent Sell Stuff", kind: "Agent", tint: "#c27cff", face: "/img/downloads/faces/sellstuff.webp", line: "Snap a photo. He sells it.",
          desc: "Message him a picture on Telegram. He writes the listing, prices it and posts it to Facebook Marketplace when you tap Approve.",
          gh: "https://github.com/lennymadethat/sellstuff", more: { label: "How he works", href: "/agents/sellstuff" } },
        { name: "Harry the Harvester", kind: "Agent", tint: "#3fe6d2", face: "/img/downloads/faces/harvester.webp", line: "Paste a link. Get the lessons.",
          desc: "A YouTube video, an article, a post. He watches the whole thing, reads it through your lens, and files a page with the to-dos in your library.",
          gh: "https://github.com/lennymadethat/harvester", more: { label: "Setup", href: "https://github.com/lennymadethat/harvester/blob/main/KIT.md" } },
        { name: "The Ingester", kind: "Agent", tint: "#ff9d5c", face: "/img/downloads/faces/ingester.webp", line: "Drop a file. Get a memory.",
          desc: "Receipts, scans, voice memos, PDFs. One inbox, read and sorted by a squad of small agents, filed onto the right project page.",
          gh: "https://github.com/lennymadethat/ingester", more: { label: "Setup", href: "https://github.com/lennymadethat/ingester/blob/main/KIT.md" } },
      ],
      tools: [
        { name: "Second Brain", kind: "Memory", tint: "#56c2ff", logo: "/img/products/vault.svg", line: "Persistent memory for any AI agent.",
          desc: "A rulebook, a memory server and a hosted library with a search index. Claude, ChatGPT, Gemini, any tool that speaks MCP remembers.",
          gh: "https://github.com/lennymadethat/second-brain", more: { label: "Setup", href: "https://github.com/lennymadethat/second-brain/blob/master/KIT.md" } },
        { name: "Mothership", kind: "Remote control", tint: "#5b9dff", logo: "/img/products/mothership-512.png", line: "Your machines, in your pocket.",
          desc: "Chat with a coding agent, open a terminal and watch your always-on computers from your phone, through one relay. No open ports, no VPN.",
          gh: "https://github.com/lennymadethat/mothership", more: { label: "Setup", href: "https://github.com/lennymadethat/mothership/blob/main/KIT.md" } },
        { name: "Skills", kind: "Claude Code", tint: "#56c2ff", svg: SKILLS, line: "Six ways of working, installable.",
          desc: "A loop that finishes a build on its own, a review that catches systems doing the wrong thing, a redesign method, and three design skills.",
          gh: "https://github.com/lennymadethat/skills", more: { label: "Setup", href: "https://github.com/lennymadethat/skills/blob/main/KIT.md" } },
      ],
      apps: [
        { name: "PlayLetter", kind: "Desktop app", tint: "#5fb089", logo: "/img/products/playletter-512.png", line: "Your newsletters, read aloud.",
          desc: "Every issue in your inbox, voiced and karaoke-synced. The Windows installer is on GitHub; phones get it from the stores.",
          gh: "https://github.com/lennymadethat/playletter-releases/releases/latest", ghLabel: "Windows", more: { label: "Site", href: "https://playletter.com" } },
        { name: "Retail Investor Report", kind: "Web app", tint: "#8ac7de", logo: "/img/products/rir-512.png", line: "Income investing, with the data on screen.",
          desc: "The Income Board, the research desk and CARL, the market-research agent you can ask anything about a fund. Nothing to install.",
          site: { label: "Open", href: "https://retailinvestorreport.com" } },
        { name: "Yield Agents", kind: "Web app", tint: "#7dc8e8", logo: "/img/products/yield-agents-180.png", line: "Agents that manage yield, with real money.",
          desc: "Autonomous agents that run yield strategies with real money. Nothing to install, open it in your browser.",
          site: { label: "Open", href: "https://yieldagents.io" } },
      ],
    };
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const tile = (x) => {
      const art = x.face ? `<img class="char" src="${esc(x.face)}" alt="${esc(x.name)}" width="360" height="360">`
        : x.svg ? x.svg : `<img class="logo" src="${esc(x.logo)}" alt="${esc(x.name)} logo">`;
      const main = x.gh ? `<a class="btn btn--main" href="${esc(x.gh)}" target="_blank" rel="noopener" aria-label="${esc((x.ghLabel || "Download") + " " + x.name)}">${GH}${esc(x.ghLabel || "Download")}</a>`
        : `<a class="btn btn--main" href="${esc(x.site.href)}" target="_blank" rel="noopener">${esc(x.site.label)} →</a>`;
      const more = x.more ? `<a class="btn btn--ghost" href="${esc(x.more.href)}"${x.more.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${esc(x.more.label)}</a>` : "";
      return `<article class="tile" style="--t:${x.tint}" title="${esc(x.desc)}"><div class="face">${art}</div>
        <div class="body"><span class="kind">${esc(x.kind)}</span><h3>${esc(x.name)}</h3><p class="line">${esc(x.line)}</p><div class="acts">${main}${more}</div></div></article>`;
    };
    document.getElementById("all").innerHTML = [...D.agents, ...D.tools, ...D.apps].map(tile).join("");
  </script>
</body>
</html>
