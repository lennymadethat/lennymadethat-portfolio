  <style>
    /* The download wall: every agent with a face, every tool with its logo, each tile one tap from its GitHub. */
    :root {
      --void: #07080f; --panel: #0f1220; --edge: rgba(170,200,255,.16); --ink: #eef3fb; --soft: #c5d0df; --dim: #93a2b8;
      --blue: #56c2ff;
      --display: "Oxanium", system-ui, sans-serif; --body: "Barlow", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(ellipse at 50% -10%, #1b1640 0%, var(--void) 55%) fixed, var(--void); color: var(--ink); font: 400 17px/1.55 var(--body); }
    a { color: inherit; }
    .wrap { width: min(1640px, 100%); margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }
    .top { position: sticky; top: 0; z-index: 10; background: rgba(7,8,15,.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--edge); }
    .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
    .brand { font: 800 15px/1 var(--display); letter-spacing: .14em; text-decoration: none; }
    .back { font: 600 13px/1 var(--mono); letter-spacing: .08em; color: var(--soft); text-decoration: none; }
    .back:hover { color: var(--blue); }

    header.hero { padding-block: clamp(20px, 3.5vh, 40px) clamp(14px, 2.5vh, 26px); display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
    .eyebrow { font: 600 12px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--blue); margin: 0 0 6px; }
    h1 { font: 800 clamp(30px, 4vw, 52px)/.95 var(--display); text-transform: uppercase; margin: 0; }
    .lede { font-size: 15.5px; color: var(--soft); max-width: 46ch; margin: 0; }

    footer { padding-block: 14px; font-size: 11px; }
    }
    @media (min-width: 641px) and (max-height: 760px) { .tile { min-height: 0; } .body { padding-block: 10px; } header.hero { padding-block: 14px 12px; } }
    footer { padding-block: 22px 24px; color: var(--dim); font: 500 13px/1.6 var(--mono); }
  </style>
