<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Personal Agents">
  <rect width="512" height="512" rx="112" fill="#14181B"/>
  <!-- vault dial -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#EDEBE4" stroke-width="26"/>
  <!-- ticks -->
  <g stroke="#5B6670" stroke-width="18" stroke-linecap="round">
    <line x1="256" y1="72" x2="256" y2="104"/>
    <line x1="256" y1="408" x2="256" y2="440"/>
    <line x1="72" y1="256" x2="104" y2="256"/>
    <line x1="408" y1="256" x2="440" y2="256"/>
    <line x1="126" y1="126" x2="148" y2="148"/>
    <line x1="364" y1="364" x2="386" y2="386"/>
    <line x1="126" y1="386" x2="148" y2="364"/>
  </g>
  <!-- pointer tick + hub -->
  <line x1="364" y1="148" x2="386" y2="126" stroke="#F04D23" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="44" fill="#F04D23"/>
  <circle cx="256" cy="256" r="16" fill="#14181B"/>
</svg>
