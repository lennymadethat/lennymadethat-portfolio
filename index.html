<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lenny Made That</title>
  <meta name="description" content="Lenny Made That — a new site is being built." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#14181B" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314181B'/%3E%3Crect x='7' y='20' width='18' height='4' fill='%23F04D23'/%3E%3C/svg%3E" />
  <script>
document.documentElement.classList.add("js");
/* Boot watchdog: if the WebGL module never lights the hero, show the static type. */
window.addEventListener("load", function () {
  setTimeout(function () {
    var f = document.querySelector(".forge");
    if (f && !f.classList.contains("is-lit")) f.classList.add("is-lit");
  }, 2600);
});</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Hero-only build: the forge fills the viewport and nothing follows it. */
    body { min-height: 100vh; overflow: hidden; }
    .forge { min-height: 100vh; }
  </style>
</head>
<body>
  <main id="main">
    <!-- THE FORGE — the only thing kept while the site is redesigned (Lenny, 2026-09-24).
         Full site archived at tag archive/full-site-dev-2026-09-24. -->
    <section id="factory" class="forge" aria-labelledby="hero-heading">
      <canvas id="forge-canvas" aria-hidden="true"></canvas>
      <div class="forge-glow" aria-hidden="true"></div>
      <div class="forge-content">
        <p class="forge-kicker spec">IAN LEONARD · SAN DIEGO · OPERATOR WHO BUILDS</p>
        <h1 id="hero-heading" class="forge-title">LENNY MADE <span>THAT.</span></h1>
        <p class="forge-sub">New site in the works.</p>
      </div>
    </section>
  </main>
  <script type="module" src="hero.js"></script>
</body>
</html>
